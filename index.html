<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&family=Inter+Tight:wght@500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  color-scheme: light;
  --page:#fafaf8; --surface:#ffffff; --ink:#111113; --ink2:#5f5f66; --muted:#8a8a92;
  --grid:#ececee; --axis:#d8d8dc; --ring:#e7e7ea; --accent:#4a6cf7;
  --s1:#4a6cf7; --s2:#db6434; --s3:#1f8a44; --s4:#d64545; --s5:#808088;
  /* softened series colors: blended toward --page (not literal white) so they stay muted in
     dark mode too, not just light. Used where a large solid-fill shape (e.g. the revenue mix
     donut) reads as too heavy/saturated at bold strength -- thin bars/lines don't have that
     problem, so they keep the bold --s1..5 tokens. */
  --s1-soft: color-mix(in srgb, var(--s1) 85%, white);
  --s2-soft: color-mix(in srgb, var(--s2) 85%, white);
  --s3-soft: color-mix(in srgb, var(--s3) 85%, white);
  --s4-soft: color-mix(in srgb, var(--s4) 85%, white);
  --s5-soft: color-mix(in srgb, var(--s5) 85%, white);
  --up:#1f8a44; --down:#d64545; --real:#1f8a44; --cfo:#d63a52;
  --sc1:#4a6cf7; --sc2:#808088; --sc3:#db6434; /* scope 1 / 2 / 3 per reference */
  --glass-bg: rgba(255,255,255,.62); --glass-bg2: rgba(255,255,255,.4); --glass-bg-strong: rgba(255,255,255,.5);
  --glass-border: rgba(17,17,19,.1); --glass-shadow: rgba(17,17,19,.14);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0b0b0d; --surface:#161619; --ink:#f4f4f6; --ink2:#a8a8b0; --muted:#77777f;
  --grid:#26262b; --axis:#3a3a41; --ring:#26262b; --accent:#7b93ff;
  --s1:#7b93ff; --s2:#ff9e76; --s3:#4cc873; --s4:#ff6b5e; --s5:#8e8e96;
  --up:#4cc873; --down:#ff6b5e; --real:#4cc873; --cfo:#ff7285;
  --sc1:#7b93ff; --sc2:#8e8e96; --sc3:#ff9e76;
  --glass-bg: rgba(32,32,37,.58); --glass-bg2: rgba(32,32,37,.36); --glass-bg-strong: rgba(32,32,37,.45);
  --glass-border: rgba(255,255,255,.14); --glass-shadow: rgba(0,0,0,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0b0b0d; --surface:#161619; --ink:#f4f4f6; --ink2:#a8a8b0; --muted:#77777f;
    --grid:#26262b; --axis:#3a3a41; --ring:#26262b; --accent:#7b93ff;
    --s1:#7b93ff; --s2:#ff9e76; --s3:#4cc873; --s4:#ff6b5e; --s5:#8e8e96;
    --up:#4cc873; --down:#ff6b5e; --real:#4cc873; --cfo:#ff7285;
    --sc1:#7b93ff; --sc2:#8e8e96; --sc3:#ff9e76;
    --glass-bg: rgba(32,32,37,.58); --glass-bg2: rgba(32,32,37,.36); --glass-bg-strong: rgba(32,32,37,.45);
    --glass-border: rgba(255,255,255,.14); --glass-shadow: rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{
  background:var(--page); color:var(--ink);
  font:13.5px/1.5 "Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
/* thin persistent header */
.topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:11px;
  padding:0 20px; height:38px; background:var(--page);
  border-bottom:1px solid var(--ink); position:sticky; top:0; z-index:20;
}
.brand{font:650 14px/1 "Inter Tight",Inter,sans-serif; letter-spacing:-.01em; white-space:nowrap;flex:0 0 auto}
.brand span{color:var(--muted); font-weight:500}
nav{display:flex; gap:2px; overflow-x:auto; -webkit-overflow-scrolling:touch; flex:1; scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
/* nav-chevron: mobile-only "more tabs this way" affordance, layered over the scrollable nav strip
   (not inside it, so it isn't caught by nav's own edge-fade mask) and JS-positioned in
   positionNavChevron() since the topbar wraps to a variable height above the nav row on mobile.
   Hidden on desktop and hidden once scrolled to the end -- see positionNavChevron(). */
.nav-chevron{
  display:none; position:absolute; z-index:5; pointer-events:none;
  align-items:center; justify-content:center; width:24px; height:24px; border-radius:99px;
  background:var(--surface); border:1px solid var(--axis); color:var(--ink2); font:600 14px/1 "Inter",sans-serif;
  box-shadow:0 1px 5px rgba(0,0,0,.18);
}
.tab{
  border:0; background:transparent; color:var(--ink2); cursor:pointer; flex:0 0 auto;
  font:500 11.5px/1 "Inter",sans-serif; padding:6px 10px; border-radius:99px; white-space:nowrap;
}
.tab:hover{background:var(--grid); color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink); color:var(--page); font-weight:600}
.icon-btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--axis); background:transparent; color:var(--ink);
  border-radius:99px; padding:0 11px; height:16px; font:600 9.5px/1 "Inter",sans-serif; cursor:pointer; white-space:nowrap;
}
.icon-btn:hover{border-color:var(--ink)}
.source-tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto}
.source-picker{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.source-picker label{font:600 9px/1 "Inter",sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.source-picker select{height:30px;width:164px;border:1px solid var(--axis);border-radius:9px;background:var(--surface);color:var(--ink);padding:0 30px 0 10px;font:600 11px/1 "Inter",sans-serif;cursor:pointer}
.source-picker select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.reports-btn{height:30px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--axis);border-radius:9px;background:var(--surface);color:var(--ink);padding:0 11px;font:650 11px/1 "Inter",sans-serif;cursor:pointer;white-space:nowrap}
.reports-btn:hover{border-color:var(--ink)}
.reports-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.reports-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* expands the tap target to >=40px on touch without growing the visible pill -- see .perbtn::after */
.icon-btn::after{content:""; position:absolute; inset:-12px}
.icon-btn:disabled{opacity:.4; cursor:not-allowed}
.ai-btn{
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--glass-bg)), var(--glass-bg));
  color:var(--ink); border:1px solid var(--glass-border);
  backdrop-filter:blur(16px) saturate(1.7); -webkit-backdrop-filter:blur(16px) saturate(1.7);
  box-shadow:0 2px 10px var(--glass-shadow);
}
.ai-btn:hover{opacity:.85}
/* ---- filter bar: stays hidden and empty in normal use -- every tab (Home included) hosts the
   live #filtersUnit node (button + panel + summary, physically relocated, not rebuilt) inline in
   its own .vhead-right cluster instead. This is only a transient parking spot render() uses to
   rescue the node before a tab's old markup is wiped -- see relocateFiltersUnit(). ---- */
.filterbar{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding:4px 20px; background:var(--page); border-bottom:1px solid var(--ring);
}
.filters-unit{display:inline-flex; align-items:center; gap:6px; min-width:0}
/* ---- glass filter dropdowns (period / category / geography) ---- */
.perioddrop{position:relative}
.perbtn{
  position:relative; display:inline-flex; align-items:center; gap:4px;
  border:1px solid var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface));
  color:var(--accent); cursor:pointer;
  font:600 9px/1 "Inter",sans-serif; padding:0 6px; height:15px; border-radius:99px; white-space:nowrap;
}
.perbtn:hover{background:color-mix(in srgb, var(--accent) 22%, var(--surface))}
.perbtn::after{content:""; position:absolute; inset:-9px} /* expands the tap target to >=40px without growing the visible pill */
.perbtn.small{font:600 11px/1 "Inter",sans-serif; padding:5.5px 11px}
/* dot on the Filters pill: the only remaining "state changed" affordance now that the pill no
   longer carries a text summary (period/category/geography prose lives in the tab subtitle and
   inside the panel itself). Shown only when the current selection differs from the landing default. */
.filter-dot{
  position:absolute; top:-2px; right:-2px; width:7px; height:7px; border-radius:99px;
  background:var(--cfo); border:1.5px solid var(--surface); pointer-events:none;
}
.funnel-icon{fill:currentColor; vertical-align:-1px; margin-right:0}
.glasspanel{
  position:absolute; top:calc(100% + 8px); left:0; z-index:40; min-width:250px;
  background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:16px;
  backdrop-filter:blur(24px) saturate(1.7); -webkit-backdrop-filter:blur(24px) saturate(1.7);
  box-shadow:0 14px 40px var(--glass-shadow); padding:11px; display:none; flex-direction:column; gap:7px;
}
.glasspanel[data-open="true"]{display:flex}
/* dvh (dynamic viewport height) after vh: browsers without dvh support use the vh fallback; ones
   that do (incl. modern mobile Safari) get a height that accounts for the collapsing address bar,
   so this max-height doesn't over- or under-shoot the true visible viewport on iOS. */
/* The Filters button lives at the right side of each view header. Open the panel inward from
   that edge: left-alignment made the 360px panel extend beyond the viewport, and focusing an
   off-screen checkbox could then scroll the otherwise-hidden .view container sideways. The
   viewport cap is a second guard for narrow or zoomed desktop layouts; the mobile rule below
   still promotes this to a full-width bottom sheet. */
.filterspanel{
  left:auto; right:0; width:min(360px,calc(100vw - 28px));
  max-height:min(600px,82vh); max-height:min(600px,82dvh);
  overflow-x:hidden; overflow-y:auto; overscroll-behavior:contain; gap:9px;
}
.fp-head{display:flex; align-items:center; justify-content:space-between; gap:8px}
.fp-title{font:650 12.5px/1 "Inter Tight",sans-serif; color:var(--ink)}
/* close controls (Filters panel, drill-down overlay, Ask AI drawer) share one visibility bar:
   --ink2 at rest (not --muted -- a close X is a control, not incidental chrome), a 32px hit area,
   16px glyph, and a hover that darkens to full --ink. See .drillhead button / .ai-head button. */
.fp-close{
  border:0; background:transparent; color:var(--ink2); cursor:pointer; line-height:1;
  font-size:16px; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:8px; padding:0;
}
.fp-close:hover{color:var(--ink); background:var(--glass-bg2)}
.fp-section{display:flex; flex-direction:column; gap:4px}
.fp-sub{font-size:10px; color:var(--muted); padding:0 9px}
.fp-reset{border:0; background:transparent; color:var(--accent); font:600 10.5px/1 "Inter",sans-serif; cursor:pointer; padding:3px 7px; border-radius:6px}
.fp-reset:hover{background:var(--glass-bg2)}
/* Done: pure closure affordance, not an Apply -- every checkbox/preset above already applies live,
   so this button changes nothing but panel visibility. Primary-accent fill so it reads as "the one
   deliberate action to take when you're finished," full-width at the foot of the panel. */
.fp-done{
  width:100%; border:0; background:var(--accent); color:var(--page); cursor:pointer;
  font:650 12.5px/1 "Inter",sans-serif; height:34px; border-radius:11px; margin-top:2px;
}
.fp-done:hover{opacity:.88}
.fp-checks{display:grid; grid-template-columns:1fr 1fr; gap:0 4px}
.cbrow{display:flex; align-items:center; gap:7px; padding:4.5px 8px; border-radius:8px; cursor:pointer; font:500 11.5px/1.25 "Inter",sans-serif; color:var(--ink); min-width:0}
.cbrow span{overflow-wrap:break-word}
.cbrow:hover{background:var(--glass-bg2)}
.cbrow input[type=checkbox]{width:14px; height:14px; accent-color:var(--accent); cursor:pointer; flex:0 0 auto}
.cbrow input[type=checkbox]:disabled{opacity:.45; cursor:not-allowed}
.gp-presets{display:flex; flex-direction:column; gap:2px}
.gp-preset{
  border:0; background:transparent; text-align:left; cursor:pointer; color:var(--ink);
  font:600 12px/1.3 "Inter",sans-serif; padding:7px 9px; border-radius:9px;
}
.gp-preset:hover{background:var(--glass-bg2)}
.gp-preset[aria-pressed="true"]{color:var(--accent)}
.plan-preset-row{flex-direction:row; gap:6px}
.plan-preset-row .gp-preset{flex:1; text-align:center; border:1px solid var(--ring)}
.plan-preset-row .gp-preset[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 10%,var(--surface)); border-color:var(--accent)}
.plan-input-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.plan-input{display:grid; grid-template-columns:1fr auto; gap:8px; min-width:0}
.plan-input input{width:76px; padding:7px; border:1px solid var(--ring); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit}
.gp-preset[aria-pressed="true"]::before{content:"✓ "}
.gp-divider{height:1px; background:var(--glass-border); margin:1px 0}
.gp-caption{font:600 9.5px/1 "Inter",sans-serif; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:0 9px}
/* clickable chart marks: cursor + subtle hover lift for drill-down / cross-filter */
.xbar{cursor:pointer; transition:transform .12s ease, filter .12s ease; transform-box:fill-box; transform-origin:50% 100%}
.xbar:hover{transform:translateY(-3px); filter:brightness(1.08)}
.xslice{cursor:pointer; transition:filter .12s ease}
.xslice:hover{filter:brightness(1.12)}
.ghostbar{cursor:help}
/* ---- click-to-drill overlay ---- */
.drillover{
  position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
  background:rgba(10,10,13,.4); padding:24px;
}
.drillover[data-open="true"]{display:flex}
.drillcard{
  width:min(760px,94vw); max-height:88vh; overflow:auto; overscroll-behavior:contain; border-radius:18px;
  background:var(--glass-bg); border:1px solid var(--glass-border);
  backdrop-filter:blur(28px) saturate(1.7); -webkit-backdrop-filter:blur(28px) saturate(1.7);
  box-shadow:0 24px 64px var(--glass-shadow); padding:18px 22px 16px; color:var(--ink);
}
.drillhead{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.drillhead h3{font:650 18px/1.2 "Inter Tight",sans-serif; letter-spacing:-.02em}
.drillhead .sub{font-size:11.5px; color:var(--ink2)}
.drillhead button{
  margin-left:auto; border:0; background:transparent; color:var(--ink2); cursor:pointer; line-height:1;
  font-size:16px; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:8px; flex:0 0 auto;
}
.drillhead button:hover{color:var(--ink); background:var(--glass-bg2)}
.drillstats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:12px}
.drillchart{height:190px; margin-bottom:12px}
.drilltbl table{width:100%; border-collapse:collapse; font-size:11px}
.drilltbl th,.drilltbl td{padding:4px 6px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--glass-border); color:var(--ink2)}
.drilltbl th:first-child,.drilltbl td:first-child{text-align:left; color:var(--ink); font-weight:600}
.drillfoot{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px solid var(--glass-border)}
.drillfoot button{
  border:1px solid var(--glass-border); background:var(--glass-bg2); color:var(--ink); cursor:pointer;
  font:600 11.5px/1 "Inter",sans-serif; padding:8px 13px; border-radius:11px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.drillfoot button:hover{border-color:var(--accent)}
/* ---- misc small UI ---- */
.vhead-right{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.dlbtn{
  position:relative; display:inline-flex; align-items:center; gap:4px;
  border:1px solid var(--axis); background:transparent; color:var(--ink2); cursor:pointer;
  font:600 9px/1 "Inter",sans-serif; padding:0 9px; height:15px; border-radius:99px; white-space:nowrap;
}
.dlbtn:hover{border-color:var(--ink); color:var(--ink)}
.dl-icon{display:block; width:9px; height:9px; flex:0 0 auto}
/* expands the tap target to >=40px on touch without growing the visible pill -- same trick as
   .perbtn::after, so Filters and Download CSV read as the same small size on mobile too */
.dlbtn::after{content:""; position:absolute; inset:-12px}
.note-nf{
  font-size:10px; color:var(--muted); background:var(--grid); border-radius:8px;
  padding:3px 9px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
}
.derived-note{font-size:10px; color:var(--s2); margin-top:2px}
.hflag{cursor:help; font-size:9.5px; margin-left:3px; vertical-align:1px}
/* "CFO lens" strapline: the line a CFO's eye goes to first -- decision-relevant tension or
   watch-item, not a neutral recap. Deliberately sharp (--cfo, weight 600) but restrained: one
   line, thin accent bar, no background fill, so it reads as signal, not an alarm banner. */
.sowhat{
  flex:0 0 auto; font-size:12.5px; font-weight:600; line-height:1.5; color:var(--cfo);
  border-left:2px solid var(--cfo); padding:3px 0 3px 11px; margin:-2px 0 0;
}
.subnote{font-size:10.5px; color:var(--muted); margin-top:5px; line-height:1.4}
main{flex:1 1 auto; overflow:hidden; position:relative}
.view{
  position:absolute; inset:0; padding:9px 20px 9px;
  display:none; flex-direction:column; gap:6px; overflow-x:hidden; overflow-y:auto;
}
.view[data-active="true"]{display:flex}
@keyframes rise{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
.view[data-active="true"] .tile,
.view[data-active="true"] .card,
.view[data-active="true"] .chip,
.view[data-active="true"] .gcard{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
.view[data-active="true"] .tile:nth-child(2),.view[data-active="true"] .gcard:nth-child(2){animation-delay:.04s}
.view[data-active="true"] .tile:nth-child(3),.view[data-active="true"] .gcard:nth-child(3){animation-delay:.08s}
.view[data-active="true"] .tile:nth-child(4),.view[data-active="true"] .gcard:nth-child(4){animation-delay:.12s}
.view[data-active="true"] .tile:nth-child(5),.view[data-active="true"] .gcard:nth-child(5){animation-delay:.16s}
.vhead{flex:0 0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  border-bottom:1px solid var(--ink); padding-bottom:5px}
.vhead h2{font:650 21px/1.1 "Inter Tight",sans-serif; letter-spacing:-.02em}
.vhead .sub{font-size:12px; color:var(--ink2)}
.badge{
  font:600 9px/1 "Inter",sans-serif; border-radius:99px; padding:0 8px; height:15px; margin-left:auto;
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  color:var(--real); border:1px solid color-mix(in srgb, var(--real) 45%, transparent);
}
.badge::before{content:""; width:4px; height:4px; border-radius:99px; background:currentColor; flex:0 0 auto}
.tiles{flex:0 0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:7px}
.tile{background:var(--surface); border:1px solid var(--ring); border-radius:14px; padding:8px 12px}
.tile .k{font:600 10px/1.3 "Inter",sans-serif; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:3px}
.tile .v{font:650 21px/1.1 "Inter Tight",sans-serif; letter-spacing:-.02em}
.tile .d{font-size:11px; margin-top:2px; color:var(--ink2)}
.d.up{color:var(--up)} .d.down{color:var(--down)}
.unit{font-size:.6em; font-weight:500; color:var(--ink2)}
.body{flex:1 1 auto; display:grid; gap:9px; min-height:200px}
.g2{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.4fr 1fr}
.g12{grid-template-columns:1fr 1.4fr}
.card{
  background:var(--surface); border:1px solid var(--ring); border-radius:16px;
  padding:9px 14px 6px; display:flex; flex-direction:column; min-height:0; overflow:hidden;
}
.variance-chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.variance-chart{min-height:220px}
.variance-chart h3{border-top-color:var(--s1)}
.variance-chart:nth-child(2) h3{border-top-color:var(--s2)}
.variance-chart .chart{height:158px}
.company-chart-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:9px;margin-bottom:9px}
.company-chart{min-height:235px}
.company-chart .chart{height:174px}
.company-chart h3{border-top-color:var(--s1)}
.company-chart:nth-child(2) h3{border-top-color:var(--s4)}
@media(max-width:760px){.variance-chart-grid{grid-template-columns:1fr}}
@media(max-width:760px){.company-chart-grid{grid-template-columns:1fr}.source-picker label{display:none}.source-picker select{width:164px}.reports-btn{padding-inline:9px}}
.card h3{
  display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;
  font:650 10.5px/1.3 "Inter",sans-serif; text-transform:uppercase; letter-spacing:.07em;
  border-top:2px solid var(--ink); padding-top:7px; margin-bottom:2px;
}
/* Feature 2 (chart <-> table toggle) and the variance-analysis basis toggle both live in a
   card's h3, injected at render time -- reset the inherited uppercase/letter-spacing so the
   controls read as controls, not shouty header text. */
.ct-toggle,.vbasis-toggle{text-transform:none; letter-spacing:normal}
/* title-left / note-right card header: for cards whose body content can grow tall enough to
   threaten a note sitting above it (e.g. a donut with a multi-row legend) -- pulled onto the h3's
   own line via justify-content:space-between so title and note never compete for the same row of
   vertical space. Wraps onto its own line, left-aligned, on narrow widths (flex-wrap on .card h3). */
.h3-note{
  text-transform:none; letter-spacing:normal; font:500 10px/1.3 "Inter",sans-serif;
  color:var(--muted); text-align:right;
}
.ct-toggle{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--axis); background:transparent; color:var(--ink2); cursor:pointer;
  border-radius:7px; padding:3px 5px; line-height:0; flex:0 0 auto;
}
.ct-toggle:hover{border-color:var(--ink); color:var(--ink)}
/* expands the tap target to >=40px on touch without growing the visible button -- see .perbtn::after */
.ct-toggle::after{content:""; position:absolute; inset:-10px}
.ct-toggle svg{display:block; width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:1.5}
.vbasis-toggle{display:flex; gap:4px; flex:0 0 auto}
.vbasis-btn{
  position:relative; display:inline-flex; align-items:center;
  border:1px solid var(--axis); background:transparent; color:var(--ink2); cursor:pointer;
  font:600 9.5px/1 "Inter",sans-serif; padding:3.5px 8px; border-radius:99px; white-space:nowrap;
}
.vbasis-btn:hover{border-color:var(--ink); color:var(--ink)}
/* expands the tap target to >=40px on touch without growing the visible pill -- see .perbtn::after */
.vbasis-btn::after{content:""; position:absolute; inset:-9px}
.vbasis-btn[aria-pressed="true"]{background:var(--ink); color:var(--page); border-color:var(--ink)}
.vbasis-btn:disabled{opacity:.4; cursor:not-allowed}
.vd.up{color:var(--up)} .vd.down{color:var(--down)}
.ct-table-wrap{margin-top:4px}
.ct-table-wrap caption{caption-side:top; text-align:left; font-size:10.5px; color:var(--muted); padding:0 0 5px; font-weight:500}
.card .note{font-size:11px; color:var(--muted); margin-bottom:5px}
.card .fill,.gcard .fill{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
/* align-items:stretch (not center) clamps the legend column to the row's actual height instead of
   letting its natural content height push it out both above and below the row -- that vertical
   bleed above the row was the mix-donut/legend overlap defect. Combined with overflow-y:auto and
   justify-content:flex-start on the legend column itself (see catDonutLegend), any overflow now
   scrolls inside its own box instead of drawing over whatever sits above the card. */
.donut-row{display:flex; flex-direction:row; gap:10px; align-items:stretch; flex:1 1 auto; min-height:0}
.donut-caption{text-align:center; font-size:10.5px; color:var(--muted); flex:0 0 auto}
/* the donut's own column: grows to fill leftover row width on desktop (row layout). In mobile's
   stacked column layout this same flex-grow has no definite height to grow into (the whole card
   chain is content-sized there), which left the svg centered inside an indeterminately-tall,
   mostly-empty box -- see the mobile override below. */
/* The caption below spans the full row width (legend + donut) and centers on it, but the donut
   itself only centers within its own column to the right of the fixed 128px legend -- so its
   visual center sat noticeably right of the caption's. Shift left by half the legend+gap width
   (128+10)/2 so the circle's center lines up with the caption above/below it. */
.donut-chart-col{flex:1.6 1 auto; margin-left:-134px}
/* Revenue tab's bar-chart + donut row: a fixed height on desktop (so the donut isn't squeezed
   to the shared .body min-height floor -- see the FILE MAP note on flex:1 1 auto rows above)
   would clip content on mobile, where the two cards stack into ONE column instead of sitting
   side by side; the mobile override below hands it back to normal content-driven sizing. */
.rev-donut-row{flex:0 0 auto; height:320px}
.legend{display:flex; gap:11px; font-size:11px; color:var(--ink2); margin-bottom:5px; flex-wrap:wrap}
.legend span{display:inline-flex; align-items:center; gap:5px}
.sw{width:9px; height:9px; border-radius:2.5px; display:inline-block}
svg{display:block; width:100%; height:100%; flex:1 1 auto; min-height:0}
svg text{font:10.5px "Inter",-apple-system,sans-serif; fill:var(--muted)}
svg .dl{font-weight:650; fill:var(--ink2)}
.scrollbox{overflow:auto; flex:1 1 auto; min-height:0}
table{width:100%; border-collapse:collapse; font-size:11.5px}
th{
  position:sticky; top:0; background:var(--surface); color:var(--muted);
  font:600 10px/1.3 "Inter",sans-serif; text-transform:uppercase; letter-spacing:.05em;
  text-align:right; padding:5px 7px; border-bottom:1px solid var(--ink); z-index:1;
}
th:first-child,td:first-child{text-align:left}
td{padding:4px 7px; text-align:right; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums; color:var(--ink2)}
tr.tot td{font-weight:650; color:var(--ink); border-top:1px solid var(--axis)}
.comm{font-size:12px; line-height:1.55; color:var(--ink2); overflow:auto; flex:1 1 auto; min-height:0}
.comm p{margin:0 0 8px}
.comm b{color:var(--ink); font-weight:600}
.quote{
  border-left:2px solid var(--s2); padding:2px 0 2px 10px; margin:0 0 9px;
  font-size:11.5px; color:var(--ink2); font-style:italic;
}
.quote cite{display:block; font-style:normal; font-size:10.5px; color:var(--muted); margin-top:2px}
.tt{
  position:fixed; pointer-events:none; z-index:50; display:none;
  background:var(--surface); border:1px solid var(--ink); border-radius:8px;
  padding:7px 10px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.16); color:var(--ink);
  /* without a cap, a long infoFlag() sentence renders as one unbroken line (576px+ measured on a
     390px phone) -- showTT()'s positioning only ever clamped the RIGHT edge, so a box wider than
     the viewport got pushed to a negative left instead of wrapping. max-width forces it to wrap
     within the viewport; showTT() still does the left/right clamping for where the box sits. */
  max-width:min(260px, calc(100vw - 28px));
}
.tt b{font-weight:650}
.tt .row{display:flex; gap:7px; align-items:center; margin-top:2px; color:var(--ink2)}

/* ---- Ask AI drawer + selection pill: glassmorphism, themed for both light & dark ---- */
.ai-drawer{
  position:fixed; top:0; right:0; bottom:0; width:390px; z-index:60;
  background:
    linear-gradient(165deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent 45%),
    var(--glass-bg-strong);
  backdrop-filter:blur(24px) saturate(1.8); -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border-left:1px solid var(--glass-border);
  display:flex; flex-direction:column; transform:translateX(102%); transition:transform .28s cubic-bezier(.2,.7,.3,1);
  box-shadow:-16px 0 44px var(--glass-shadow);
}
.ai-drawer[data-open="true"]{transform:none}
.ai-head{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--glass-border)}
.ai-head b{font:650 14px/1 "Inter Tight",sans-serif}
.ai-head .sub{font-size:10.5px; color:var(--muted)}
.ai-head button{
  margin-left:auto; border:0; background:transparent; color:var(--ink2); cursor:pointer; line-height:1;
  font-size:16px; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center;
  border-radius:8px; flex:0 0 auto;
}
.ai-head button:hover{color:var(--ink); background:var(--glass-bg2)}
.ai-mode{
  display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:10px 16px 8px; padding:4px;
  border:1px solid var(--glass-border); border-radius:12px; background:var(--glass-bg2);
}
.ai-mode button{
  border:0; border-radius:9px; min-height:34px; padding:0 10px; cursor:pointer;
  background:transparent; color:var(--ink2); font:600 11.5px/1 "Inter",sans-serif;
}
.ai-mode button[aria-pressed="true"]{background:var(--ink); color:var(--page); box-shadow:0 2px 8px var(--glass-shadow)}
.ai-mode button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.ai-msgs{flex:1 1 auto; overflow:auto; overscroll-behavior:contain; padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.ai-msg{max-width:92%; border-radius:14px; padding:9px 12px; font-size:12.5px; line-height:1.5; white-space:pre-wrap}
.ai-msg.user{align-self:flex-end; background:var(--ink); color:var(--page)}
.ai-msg.bot{
  align-self:flex-start; color:var(--ink); background:var(--glass-bg2);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--glass-border);
}
.ai-msg.bot p{margin:0 0 8px}
.ai-msg.bot p:last-child{margin-bottom:0}
.ai-msg.bot ul,.ai-msg.bot ol{margin:4px 0 8px; padding-left:18px}
.ai-msg.bot li{margin-bottom:3.5px}
.ai-msg.bot ul:last-child,.ai-msg.bot ol:last-child{margin-bottom:0}
.ai-msg.bot strong{font-weight:650; color:var(--ink)}
.ai-msg.sys{align-self:stretch; background:transparent; border:1px dashed var(--axis); color:var(--muted); font-size:11.5px}
.ai-form{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--glass-border)}
.ai-form textarea{
  flex:1; resize:none; border:1px solid var(--glass-border); border-radius:12px; background:var(--glass-bg2);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  color:var(--ink); font:12.5px/1.45 "Inter",sans-serif; padding:9px 11px; height:44px; outline:none;
}
.ai-form textarea:focus{border-color:var(--accent)}
.ai-form button{
  border:0; background:var(--ink); color:var(--page); border-radius:12px; padding:0 16px;
  font:600 12.5px/1 "Inter",sans-serif; cursor:pointer;
}
.ai-form button:disabled{opacity:.4}
.ai-sugg{display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 10px}
.ai-sugg button{
  border:1px solid var(--glass-border); background:var(--glass-bg2); color:var(--ink2); border-radius:99px;
  padding:5px 11px; font:500 11px/1 "Inter",sans-serif; cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.ai-sugg button:hover{border-color:var(--accent); color:var(--ink)}
.ai-filter-ctx{
  margin:0 16px 8px; padding:6px 10px; border-radius:10px; font-size:10.5px; color:var(--ink2);
  background:var(--glass-bg2); border:1px solid var(--glass-border); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.sel-pill{
  position:fixed; z-index:55; display:none; cursor:pointer;
  background:var(--glass-bg); color:var(--ink); border:1px solid var(--glass-border); border-radius:99px; padding:6px 13px;
  font:600 11.5px/1 "Inter",sans-serif; box-shadow:0 6px 20px var(--glass-shadow);
  backdrop-filter:blur(18px) saturate(1.7); -webkit-backdrop-filter:blur(18px) saturate(1.7);
}
/* The expanded finance navigation no longer fits on one row at common laptop widths. Keep the
   desktop dashboard layout, but give the tabs their own scrollable header row with a visible cue. */
@media (min-width:1100px) and (max-width:1399px){
  .topbar{height:auto;flex-wrap:wrap;padding:7px 20px;gap:7px 10px}
  nav{order:3;flex:1 1 100%;width:100%;
    mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
  .nav-chevron{display:flex}
  .tab{min-height:32px;display:inline-flex;align-items:center}
  .source-tools{margin-left:auto}
}
/* ---- mobile ---- */
/* ---- mobile / narrow desktop, ~390px and up. Desktop (>=1100px) is untouched by this block. ---- */
@media (max-width:1099px){
  body{overflow:auto; overflow-x:hidden} /* backstop only -- real offenders get their own scrollbox, not a clip */
  main{overflow:visible}
  .view{position:static; display:none; overflow:visible; padding:14px 14px 10px}
  .view[data-active="true"]{display:flex}
  .body{grid-template-columns:1fr !important}
  .card:not(.hero-box){min-height:230px}
  #home h1{font-size:26px}
  .topbar{height:auto; flex-wrap:wrap; padding:8px 14px; gap:8px; align-items:flex-start}
  .gwrap{grid-template-columns:1fr; grid-template-rows:none}
  .gcard{min-height:170px}
  .ai-drawer{width:100%}
  #home .hero{padding:14px 0 10px; gap:12px}
  #home .home-hero-head{flex-direction:column; gap:10px}
  #home .home-tools{width:100%; padding-top:0}
  #home .home-metrics{grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
  #home .home-explore-grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
  #home .home-about-row{grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
  #home .about-stage:nth-child(3){border-right:0}
  #home .about-stage:nth-child(4){border-top:1px solid var(--ring); padding-top:10px}
  #home .about-stage:nth-child(5){border-top:1px solid var(--ring); padding-top:10px}
  #home .about-stage:nth-child(6){border-top:1px solid var(--ring); padding-top:10px}
  .badge{margin-left:0}
  .brand{flex:1 1 auto; padding-top:5px}
  .icon-btn{flex:0 0 auto}
  /* nav: horizontally scrollable tab strip, edge-fade hint so it reads as swipeable, active tab
     kept in view (see go()'s scrollIntoView). No hamburger -- same tabs, just scrollable. */
  nav{
    order:3; flex:1 1 100%; width:100%; margin-top:2px;
    -webkit-overflow-scrolling:touch;
    mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
  }
  .nav-chevron{display:flex}
  .tab{min-height:40px; display:inline-flex; align-items:center}
  .filterbar{padding:4px 14px}
  .vhead-right{margin-left:0; width:100%}
  /* Put Filters at the leading edge of the wrapped controls so its dropdown can stay visibly
     attached to the button without needing modal/bottom-sheet positioning. */
  .vhead-right .filters-unit{order:-1}
  /* the disclosure badge's text is too long to fit unbroken on narrow phones -- base rule keeps
     it nowrap for desktop's single-line look, mobile lets it wrap instead of silently clipping
     past the viewport edge (body's overflow-x:hidden backstop would otherwise just cut it off) */
  .note-nf{white-space:normal; text-align:left}
  /* donut + legend stack vertically instead of side-by-side */
  .donut-row{flex-direction:column}
  /* stacked layout has no definite height to grow into -- size to content (the svg itself)
     instead of flex-growing into an indeterminate box (see the base-rule comment). BUT
     sizeSquareSvg() (see the script) measures the column's clientWidth/clientHeight to pick the
     svg's square size -- with height:auto and no content yet to derive a height from, clientHeight
     reads as ~0 at measurement time, so the donut rendered tiny (a few px of "true" height,
     floored only by sizeSquareSvg's 30px minimum) regardless of how wide the card actually was.
     aspect-ratio:1 gives the column a real, CSS-derived height (== its stretched width) before
     the JS ever measures it, so the donut scales with the card like it does on desktop. */
  .donut-chart-col{flex:0 0 auto; margin-left:0; aspect-ratio:1; width:100%; max-width:360px}
  /* the two cards in this row stack into one column on mobile (see .body override above), so
     the desktop fixed height would clip them -- go back to natural, content-driven height */
  .rev-donut-row{height:auto}
  /* On mobile/narrow windows this remains a true dropdown attached to the Filters button.
     The ordered control sits at the left edge of the wrapped header controls, so open rightward;
     the viewport-safe width prevents the menu from creating horizontal page overflow. */
  .filterspanel{
    position:absolute; left:0; right:auto; top:calc(100% + 8px); bottom:auto;
    width:min(360px,calc(100vw - 28px)); max-width:none; transform:none;
    max-height:min(560px,72vh); max-height:min(560px,72dvh); border-radius:16px;
  }
  /* drill-down overlay and Ask AI drawer go full-screen */
  .drillover{padding:0}
  .drillcard{width:100%; max-width:100%; height:100%; max-height:100%; border-radius:0}
  /* tap targets >=40px */
  .cbrow{min-height:40px}
  .gp-preset{min-height:40px; display:flex; align-items:center}
  .fp-close,.fp-reset{min-height:40px; min-width:40px; display:inline-flex; align-items:center; justify-content:center}
  .fp-done{min-height:40px}
  .drillhead button,.ai-head button{min-width:40px; min-height:40px}
  .ai-mode button{min-height:40px}
  /* readable without zoom */
  body{font-size:14.5px}
  .tile .v{font-size:24px}
  /* iOS Safari auto-zooms the page on focusing any text input under 16px -- keep the Ask AI
     textarea (the only free-text input in the app; filters are all checkboxes) at 16px on mobile */
  .ai-form textarea{font-size:16px}
}
/* Phone-specific dropdown: narrower than the tablet menu, single-column choices, and a height
   that leaves a visible bottom gutter even on short screens. The menu stays attached beneath
   the Filters button and scrolls internally when every filter cannot fit at once. */
@media (max-width:600px){
  #home h1{font-size:30px}
  #home .home-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  #home .home-explore-grid{grid-template-columns:1fr}

  #home .about-stage:nth-child(-n+2){border-top:0 !important; padding-top:0}
  .plan-input-grid{grid-template-columns:1fr; gap:6px}

  .filterspanel{
    width:min(300px,calc(100vw - 28px));
    max-height:min(480px,calc(100vh - 232px));
    max-height:min(480px,calc(100dvh - 232px));
  }
  .filterspanel .fp-checks{grid-template-columns:1fr}
}

<script>

/* ============================================================

   section opens with a one-line "----------" banner comment, grep-able with

   Per-tab UI (charts + tables for one tab) lives in the "tab renderers"
   group below -- that's the fastest way in when a change is scoped to

   format/state helpers .......................... line 621
   tooltip lifecycle (touch-safe show/hide) ...... line 631
   SVG chart primitives (bar/donut/waterfall/...)  line 673

   variance analysis tables (Revenue & Profit) ... line 1331

   "so what" straplines, one per tab .............. line 1509
   VIEWS/tabs config .............................. line 1582
   event markers + Q4 FY26E guided ghost bar ..... line 1624
   click-to-drill overlay (category/geography) ... line 1662
   tab renderers: Home ............................ line 1751
   tab renderers: Glass ............................ line 1928
   tab renderers: Revenue .......................... line 2065
   tab renderers: Profitability .................... line 2151
   tab renderers: Balance Sheet .................... line 2275
   tab renderers: FX & Capital Returns ............. line 2385
   tab renderers: People/Headcount ................. line 2486
   tab renderers: Outlook .......................... line 2591
   tab renderers: CSRD/Environment ................. line 2647
   nav/filters shell (buildNav, filtersPanelHTML) .. line 2738
   top-level render()/go() orchestration ........... line 2963
   Ask AI drawer (chat UI, markdown, context) ...... line 2996
   boot: loadData() -> initFilters -> buildNav -> go()  end of file
   ============================================================ */
let D = null; // loaded from data.json at startup, see loadData() below

let PUBLIC_CONTEXT = {companies:{},macro:{}};
let companySlug = "apple";
const SLOT=["--s1","--s2","--s3","--s4","--s5"];

/* ---------- helpers ---------- */
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const col=c=>(typeof c==="string"&&c.startsWith("--"))?css(c):c;

const B=v=>"$"+(v/1000).toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+"B";
const M=v=>"$"+v.toLocaleString("en-US");
const UNIT_TCO2E='<span class="unit"> tCO2e</span>'; // shrunk unit suffix, keeps the magnitude (M/K) full-size next to the number
const pct=(v,d=1)=>v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})+"%";

const tt=document.getElementById("tt");
/* ---------- tooltip lifecycle: on a mouse this is trivial (mousemove shows, mouseleave hides).
   On touch, tap generates a synthetic mousemove with no matching "leave", so without help a
   tooltip can get stuck open through scrolling, tab switches, filter changes, etc. Fixes:
   - ttSourceEl remembers which chart mark currently owns the visible tooltip.

     scroll listener and a global touchstart listener both call hideTT().

      stroke:css("--axis"),"stroke-width":1,"stroke-dasharray":"3 3"},svg);
    prev=Y(running);
    const lbl = s.type==="total" ? fmtTotal(s.value) : fmtDelta(s.value);
    el("text",{x:x+bw/2,y:y0-5,"text-anchor":"middle",class:"dl"},svg).textContent=lbl;
    el("text",{x:x+bw/2,y:H-10,"text-anchor":"middle"},svg).textContent=s.label;
    r.addEventListener("mousemove",e=>showTT(`<b>${s.label}</b><div class="row">${lbl}</div>`,e.clientX,e.clientY,e.currentTarget));
    r.addEventListener("mouseleave",hideTT);
  });
}

/* ---------- Feature 2: chart <-> table toggle, generic ----------------------------------------
   One wrapper -- chartTable(svg, kind, opts) -- replaces a direct barChart/groupedBar/
   divergingBar/waterfall(svg, opts) call at each site. It draws the chart as before UNLESS that
   svg's id is in chartTableMode, in which case it builds an HTML table from the SAME opts object
   the chart would have used, so the table can never drift from what the chart is showing. State
   is per-card (keyed by svg id) and session-only (a plain Set, not part of the URL hash) -- it
   resets on reload, same lifecycle as varBasis.
   Skipped deliberately (not routed through this wrapper): the Home architecture diagram (not a
   data chart); the two donuts that already carry a full value legend/table next to them
   (Revenue's category-mix donut, Env's scope donut, which has its own #scopeTable); the Env
   progress gauge (a single value, not tabular data); the drill-down overlay's trend chart (a
   modal, not a tab card); and every chart on the Glass tab (its aesthetic is bespoke dark glass
   -- a plain HTML table/toggle button would fight that look, not fit it). ---------------------- */
const chartTableMode=new Set();
function toggleChartTable(svgId){
  if(chartTableMode.has(svgId)) chartTableMode.delete(svgId); else chartTableMode.add(svgId);
  render();
}
const CT_ICON_CHART=`<svg viewBox="0 0 16 16"><path d="M2 13.5V6M7 13.5V2.5M12 13.5V9" stroke-linecap="round"/></svg>`;
const CT_ICON_TABLE=`<svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M1.5 6.5h13M6 2.5v11" stroke-linecap="round"/></svg>`;
function ensureCardToggle(svg,svgId){
  const card=svg.closest(".card");
  const h3=card&&card.querySelector("h3");
  if(!h3 || h3.querySelector(".ct-toggle")) return; // already injected this render pass
  const isTable=chartTableMode.has(svgId);
  const titleSpan=document.createElement("span");
  titleSpan.textContent=h3.textContent;
  const btn=document.createElement("button");
  btn.type="button"; btn.className="ct-toggle"; btn.dataset.ctToggle=svgId;
  btn.title=isTable?"Show chart":"Show as table";
  btn.setAttribute("aria-label",btn.title);
  btn.innerHTML=isTable?CT_ICON_CHART:CT_ICON_TABLE;
  h3.textContent=""; h3.appendChild(titleSpan); h3.appendChild(btn);
}
function ctFmtNum(v,dp){ return v==null? "n/a" : v.toLocaleString("en-US",{minimumFractionDigits:dp||0,maximumFractionDigits:dp||0}); }
// buildChartTableHTML: one <table> per chart "kind", built from the exact opts object the chart
// call would have used. Reuses the house table CSS (numerals already right-align via td{}).
function buildChartTableHTML(kind,opts,caption){
  const cap=caption?`<caption>${escapeHtml(caption)}</caption>`:"";
  if(kind==="bar"){
    const fmt=opts.fmt||B;
    const hasSub=!!opts.sub;
    return `<table>${cap}<tr><th>Label</th><th>Value</th>${hasSub?"<th>YoY</th>":""}</tr>${
      opts.labels.map((l,i)=>`<tr><td>${escapeHtml(String(l))}</td><td>${escapeHtml(fmt(opts.values[i]))}</td>${
        hasSub? `<td>${opts.sub[i]==null?"n/a":sgn(opts.sub[i])+"%"}</td>`:""}</tr>`).join("")
    }${opts.ghost?`<tr><td>${escapeHtml(opts.ghost.label)}</td><td>${escapeHtml(fmt(opts.ghost.value))}</td>${hasSub?"<td>estimate</td>":""}</tr>`:""}</table>`;
  }
  if(kind==="grouped"){
    const fmt=opts.fmt||B;
    return `<table>${cap}<tr><th>Category</th><th>${escapeHtml(opts.nameA)}</th><th>${escapeHtml(opts.nameB)}</th></tr>${
      opts.cats.map((c,i)=>`<tr><td>${escapeHtml(String(c))}</td><td>${escapeHtml(fmt(opts.seriesA[i]))}</td><td>${escapeHtml(fmt(opts.seriesB[i]))}</td></tr>`).join("")
    }</table>`;
  }
  if(kind==="diverging"){
    const fmt=opts.fmt||(v=>sgn(v)+"%");
    return `<table>${cap}<tr><th>Name</th><th>Value</th></tr>${
      opts.names.map((n,i)=>`<tr><td>${escapeHtml(n)}</td><td>${escapeHtml(fmt(opts.values[i]))}</td></tr>`).join("")
    }</table>`;
  }
  if(kind==="waterfall"){
    const fmtTotal=opts.fmtTotal||B, fmtDelta=opts.fmtDelta||(v=>sgn(v/1000)+"B");
    return `<table>${cap}<tr><th>Step</th><th>Type</th><th>Value</th></tr>${
      opts.steps.map(s=>`<tr><td>${escapeHtml(s.label)}</td><td>${s.type==="total"?"Subtotal":"Δ"}</td><td>${escapeHtml(s.type==="total"?fmtTotal(s.value):fmtDelta(s.value))}</td></tr>`).join("")
    }</table>`;
  }
  return "";
}
function chartTable(svg,kind,opts){
  const svgId=svg.id;
  const card=svg.closest(".card");
  const titleForCaption = card && card.querySelector("h3") ? card.querySelector("h3").textContent.trim() : "";
  ensureCardToggle(svg,svgId);
  if(chartTableMode.has(svgId)){
    svg.style.display="none";
    const host=svg.parentElement;
    const wrap=document.createElement("div");
    wrap.className="ct-table-wrap scrollbox";
    wrap.innerHTML=buildChartTableHTML(kind,opts,`${titleForCaption} · ${periodLabel()}`);
    host.appendChild(wrap);
    return;
  }
  ({bar:barChart,grouped:groupedBar,diverging:divergingBar,waterfall:waterfall})[kind](svg,opts);
}

/* ---------- global filter state ---------- */
const state={ q:null, cat:null, geo:null, pgeo:null };
function initFilters(){
  // Default period = current fiscal YTD for the selected company. Point-in-time cards still use
  // the latest selected quarter, while flow metrics aggregate the selected fiscal quarters.
  // Hash deep links (parsed right after this, in loadData()) override this default when they
  // specify their own q= param.
  state.q=new Set(currentFiscalYtdIndexes());
  state.cat=new Set(D.cat.names);
  state.geo=new Set(D.geo.names);
  state.pgeo=new Set(D.geo.names);
}
function selQ(){ return [...state.q].sort((a,b)=>a-b); }
// snapQ: point-in-time metrics (balance sheet, headcount, RSUs, notionals, share count) always
// read the LATEST selected quarter's snapshot -- selecting a period doesn't "sum" a balance sheet.
function snapQ(){ return Math.max(...state.q); }
// focusQ: kept as an alias of snapQ for "most recently reported quarter, for reference" call
// sites (single-quarter references that are never summed, e.g. Outlook's "actual growth" tile).
function focusQ(){ return Math.max(...state.q); }
function pyIdx(i){ return i>=4? i-4 : null; }
function qLabel(i){ return companyPeriodAt(i)?.label || D.meta.quarters[i] || `Quarter ${i+1}`; }
function fyNum(i){ return 2000+ +D.meta.quarters[i].slice(-2); }
function isContiguous(s){ for(let k=1;k<s.length;k++) if(s[k]!==s[k-1]+1) return false; return true; }
// periodLabel: the single source of truth for how a selected quarter-set is narrated in prose --
// the period dropdown button, tab sub-headers, tile sublabels, donut centers, CSV filenames.
function periodLabel(qIdxs){
  const s=[...(qIdxs||selQ())].sort((a,b)=>a-b);
  if(!s.length) return "no quarters selected";
  const parsed=s.map(index=>parseCompanyPeriodLabel(qLabel(index)));
  const sameFY=parsed.every(item=>item && item.fy===parsed[0].fy);
  const orderedQuarters=sameFY && parsed.every((item,index)=>index===0 || item.quarter===parsed[index-1].quarter+1);
  if(s.length===companyPeriods().length) return `${qLabel(s[0])} – ${qLabel(s[s.length-1])} · ${s.length} quarters`;
  if(sameFY && orderedQuarters && parsed[0].quarter===1){
    if(s.length===4) return `FY${String(parsed[0].fy).padStart(2,"0")}`;
    return `FY${String(parsed[0].fy).padStart(2,"0")} · ${s.length} quarters (${s.length*3}mo)`;
  }
  if(s.length===1) return qLabel(s[0]);
  if(isContiguous(s)) return `${qLabel(s[0])} – ${qLabel(s[s.length-1])} · ${s.length} quarters`;
  return `${s.length} quarters selected`;
}
// periodLabelShort: an abbreviated form of periodLabel(), for tight spaces (donut center hole)
// where the full prose ("FY26 · 3 quarters (9mo)") would overflow. The full wording still
// belongs somewhere visible nearby (a caption under the chart) -- this is only for the hole.
function periodLabelShort(qIdxs){
  const s=[...(qIdxs||selQ())].sort((a,b)=>a-b);
  if(!s.length) return "none";
  const parsed=s.map(index=>parseCompanyPeriodLabel(qLabel(index)));
  const sameFY=parsed.every(item=>item && item.fy===parsed[0].fy);
  if(s.length===companyPeriods().length) return `All ${s.length}Q`;
  if(sameFY && parsed[0].quarter===1 && parsed.every((item,index)=>item.quarter===index+1)) return s.length===4?`FY${String(parsed[0].fy).padStart(2,"0")}`:`FY${String(parsed[0].fy).padStart(2,"0")} ${s.length*3}mo`;
  if(s.length===1) return qLabel(s[0]);
  return `${s.length}Q`;
}
// filename-safe period tag, used to suffix CSV downloads
function periodFileTag(qIdxs){
  const s=[...(qIdxs||selQ())].sort((a,b)=>a-b);
  const parsed=s.map(index=>parseCompanyPeriodLabel(qLabel(index)));
  const sameFY=parsed.length&&parsed.every(item=>item&&item.fy===parsed[0].fy);
  if(s.length===companyPeriods().length) return `${s.length}q`;
  if(sameFY && parsed[0].quarter===1 && parsed.every((item,index)=>item.quarter===index+1)) return `FY${String(parsed[0].fy).padStart(2,"0")}_${s.length*3}mo`;
  if(s.length===1) return qLabel(s[0]).replace(/\s+/g,"");
  return `${s.length}q`;
}
function periodSub(suffix){
  const lbl=periodLabel();
  return suffix ? `${lbl} · ${suffix}` : lbl;
}
function yoyPctOf(arr,i){ const p=pyIdx(i); if(p==null||arr[i]==null||arr[p]==null) return null; return 100*(arr[i]-arr[p])/arr[p]; }
function yoyPtsOf(arr,i){ const p=pyIdx(i); if(p==null||arr[i]==null||arr[p]==null) return null; return arr[i]-arr[p]; }
function fnum(v){ return v==null? "n/a" : v; }
/* ---------- period aggregation (Feature 6): flow metrics SUM across selected quarters,
   ratios recompute on the summed numerator/denominator, point-in-time metrics use snapQ() ---------- */
function aggSum(arr,qIdxs){ return sum((qIdxs||selQ()).map(k=>arr[k])); }
function pyQIdxsOf(qIdxs){
  const pys=(qIdxs||selQ()).map(pyIdx);
  return pys.some(p=>p==null) ? null : pys;
}
// YoY for metrics that carry their OWN filed prior-year array covering all 7 quarters
// (is.totalRevPY, cat.revenuePY, geo.revenuePY, geo.opIncPY) -- always available.
function aggYoYFromPY(curArr,pyArr,qIdxs){
  const cur=aggSum(curArr,qIdxs), py=aggSum(pyArr,qIdxs);
  return py? 100*(cur-py)/py : null;
}
// YoY for is.* metrics with NO filed PY sibling: only available when every selected quarter
// is FY26 (so pyIdx(k) resolves to the real filed FY25 quarter already in this dataset).
function aggYoYSameQtr(arr,qIdxs){
  const pyQ=pyQIdxsOf(qIdxs);
  if(!pyQ) return null;
  const cur=aggSum(arr,qIdxs), py=sum(pyQ.map(p=>arr[p]));
  return py? 100*(cur-py)/py : null;
}
function aggGmPctTotal(qIdxs){ const rev=aggSum(D.is.totalRev,qIdxs), gm=aggSum(D.is.grossMargin,qIdxs); return rev? 100*gm/rev : null; }
function aggGmPctProducts(qIdxs){ const rev=aggSum(D.is.productsRev,qIdxs), cos=aggSum(D.is.productsCos,qIdxs); return rev? 100*(rev-cos)/rev : null; }
function aggGmPctServices(qIdxs){ const rev=aggSum(D.is.servicesRev,qIdxs), cos=aggSum(D.is.servicesCos,qIdxs); return rev? 100*(rev-cos)/rev : null; }
function aggTaxRate(qIdxs){ const pretax=aggSum(D.is.pretax,qIdxs), tax=aggSum(D.is.tax,qIdxs); return pretax? 100*tax/pretax : null; }
function aggOpexRatio(qIdxs){ const rev=aggSum(D.is.totalRev,qIdxs), opex=aggSum(D.is.totalOpex,qIdxs); return rev? 100*opex/rev : null; }
// ratio-vs-ratio YoY (points), for metrics expressed as %: compares the aggregate ratio for
// qIdxs against the aggregate ratio for the same quarters one year earlier, when available.
function aggRatioPtsYoY(ratioFn,qIdxs){
  const pyQ=pyQIdxsOf(qIdxs);
  if(!pyQ) return null;
  const cur=ratioFn(qIdxs), py=ratioFn(pyQ);
  return (cur==null||py==null)? null : +(cur-py).toFixed(1);
}
// EPS is NEVER summed across quarters as an aggregation strategy -- diluted share counts change
// every quarter, so a summed EPS is simply wrong (e.g. 2.84+2.01+2.02=6.87 vs Apple's filed 6.88
// for 9mo FY26). Use only an exact as-filed period value: a filed single quarter, either filed
// nine-month period, or FY25's directly filed annual value. Standalone Q4 FY25 remains null because
// it cannot be derived, but that does not invalidate the annual $7.46 Apple filed in its 10-K.
function aggEPS(qIdxs){
  const s=[...(qIdxs||selQ())].sort((a,b)=>a-b);
  if(s.length===1) return D.is.epsDiluted[s[0]];
  const isFY25=s.length===4 && [0,1,2,3].every(k=>s.includes(k));
  const is9mo26=s.length===3 && [4,5,6].every(k=>s.includes(k));
  const is9mo25=s.length===3 && [0,1,2].every(k=>s.includes(k));
  if(isFY25) return D.is.epsDilutedAnnual?.fy25 ?? null;
  if(is9mo26) return D.is.epsDiluted9mo.fy26;
  if(is9mo25) return D.is.epsDiluted9mo.fy25;
  return null;
}
// true when aggEPS(qIdxs) came from the filed 9mo EPS figure (not a single quarter) -- callers use
// this to append an "as filed, 9mo" qualifier so it's never mistaken for a naive sum.
function aggEPSIs9mo(qIdxs){
  const s=[...(qIdxs||selQ())].sort((a,b)=>a-b);
  return s.length===3 && ([4,5,6].every(k=>s.includes(k)) || [0,1,2].every(k=>s.includes(k)));
}
function aggEPSFiledLabel(qIdxs){
  const s=[...(qIdxs||selQ())].sort((a,b)=>a-b);
  if(s.length===4 && [0,1,2,3].every(k=>s.includes(k))) return "as filed, FY25";
  if(aggEPSIs9mo(s)) return "as filed, 9mo";
  return "";
}
function epsFiledInfo(){
  return infoFlag("EPS is never summed across quarters because Apple's diluted share count changes by reporting period. This is the exact period figure Apple filed, not a calculated total.");
}
function epsUnavailableInfo(){
  return infoFlag("Apple does not file an EPS figure for this selected combination of quarters. The dashboard will not sum quarterly EPS because changing diluted share counts would make that result incorrect.");
}
function yoyTile(label,arr,qIdxs,fmt=B,higherGood=true,noPYNote=null){
  const s=qIdxs||selQ();

  const v=aggSum(arr,s);

  if(d==null) return tile(label,fmt(v),noPYNote||null);
  return tile(label,fmt(v),`${sgn(d)}% YoY`,higherGood? d>=0 : d<=0);
}
function derivedBadge(realLabel){

function notFilteredNote(text){ return `<span class="note-nf">● as-filed disclosure · ${text||"not affected by quarter filter"}</span>`; }

// afterFilterChange: the single path every filter mutation (period chip click, quarter/category/

/* ---------- shareable URL state (Feature 4) ---------- */
// "none" is a distinct token from "" -- category/geography can now be deliberately empty (the
// Filters panel's None button), and that has to round-trip through the hash exactly, not collapse
// back to "unspecified" (which decodeIdxSet would otherwise re-expand to the full default set).
function encodeIdxSet(set,total){
  if(set.size===total) return "all";
  if(set.size===0) return "none";
  const arr=[...set].sort((a,b)=>a-b);
  const parts=[]; let start=arr[0], prev=arr[0];
  for(let k=1;k<=arr.length;k++){
    if(k<arr.length && arr[k]===prev+1){ prev=arr[k]; continue; }
    parts.push(start===prev?String(start):`${start}-${prev}`);
    if(k<arr.length){ start=arr[k]; prev=arr[k]; }
  }
  return parts.join(",");
}
function decodeIdxSet(str,total){
  if(!str) return null;
  if(str==="all") return new Set(Array.from({length:total},(_,i)=>i));
  if(str==="none") return new Set();
  const out=new Set();
  str.split(",").forEach(tok=>{
    const m=/^(\d+)(?:-(\d+))?$/.exec(tok.trim());
    if(!m) return;
    const a=+m[1], b=m[2]!=null? +m[2] : a;
    for(let k=Math.min(a,b); k<=Math.max(a,b); k++) if(k>=0 && k<total) out.add(k);
  });
  return out.size? out : null;
}
function namesToIdxSet(selSet,names){ return new Set(names.map((n,idx)=>idx).filter(idx=>selSet.has(names[idx]))); }
function idxSetToNames(idxSet,names){ return new Set([...idxSet].map(idx=>names[idx]).filter(Boolean)); }
function buildHash(){
  const parts=[`tab=${current}`, `company=${companySlug}`, `q=${encodeIdxSet(state.q,companyPeriods().length)}`];
  parts.push(`cat=${encodeIdxSet(namesToIdxSet(state.cat,D.cat.names),D.cat.names.length)}`);
  parts.push(`geo=${encodeIdxSet(namesToIdxSet(state.geo,D.geo.names),D.geo.names.length)}`);
  parts.push(`pgeo=${encodeIdxSet(namesToIdxSet(state.pgeo,D.geo.names),D.geo.names.length)}`);
  return "#"+parts.join("&");
}
function syncHash(){
  try{
    const h=buildHash();
    if(location.hash!==h) history.replaceState(null,"",h);
  }catch(e){ /* non-fatal: URL state is a convenience, never block rendering on it */ }
}
// parseHashState: reads location.hash into `state` (q/cat/geo/pgeo) before the first render.
// Invalid or missing pieces fall back silently to whatever initFilters() already set.
// Returns the requested tab id, or null, so the caller can route it through go().
function parseHashState(){
  try{
    const h=location.hash.replace(/^#/,"");
    if(!h) return null;
    const params=new URLSearchParams(h);
    const requestedCompany=params.get("company");
    if(requestedCompany && COMPANY_DATA?.companies?.[requestedCompany]) companySlug=requestedCompany;
    const q=decodeIdxSet(params.get("q"),companyPeriods().length);
    if(q && q.size) state.q=q; // period keeps its min-1-quarter floor even against a crafted "q=none" link
    else state.q=new Set(currentFiscalYtdIndexes());
    const cat=decodeIdxSet(params.get("cat"),D.cat.names.length);
    if(cat) state.cat=idxSetToNames(cat,D.cat.names); // may legitimately be empty ("cat=none")
    const geo=decodeIdxSet(params.get("geo"),D.geo.names.length);
    if(geo) state.geo=idxSetToNames(geo,D.geo.names); // may legitimately be empty ("geo=none")
    const pgeo=decodeIdxSet(params.get("pgeo"),D.geo.names.length);
    if(pgeo) state.pgeo=idxSetToNames(pgeo,D.geo.names);
    const tab=params.get("tab");
    return (tab && VIEWS.some(v=>v.id===tab)) ? tab : null;
  }catch(e){ return null; }
}

/* ---------- CSV export (synthetic transaction-level, seeded/deterministic) ---------- */
function mulberry32(seed){
  return function(){
    seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15, 1|seed);
    t=t+Math.imul(t^t>>>7, 61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function seedFromStr(s){
  let h=1779033703^s.length;
  for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return (h^h>>>16)>>>0;
}
function rndFor(tag){ return mulberry32(seedFromStr(tag)); }
function csvCell(v){ const s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadCSV(filename,comment,columns,rows){
  const lines=["# "+comment, columns.join(",")];
  rows.forEach(r=>lines.push(r.map(csvCell).join(",")));
  const blob=new Blob([lines.join("\n")+"\n"],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
// integer allocation (cents, or units) summing exactly to `total`, lognormal-ish spread, de-duplicated
function allocateInt(total,n,rnd){
  total=Math.round(total);
  if(n<1) n=1;
  if(total<=0) return Array(n).fill(0);
  if(n===1) return [total];
  const raw=Array.from({length:n},()=>Math.exp((rnd()-0.5)*1.7)*(0.6+rnd()*0.8));
  const sumRaw=raw.reduce((a,b)=>a+b,0);
  let parts=raw.map(w=>Math.max(1,Math.round(total*w/sumRaw)));
  let diff=total-parts.reduce((a,b)=>a+b,0);
  parts[parts.length-1]+=diff;
  if(parts[parts.length-1]<1){
    let need=1-parts[parts.length-1]; parts[parts.length-1]=1;
    let idx=0; for(let i=1;i<parts.length-1;i++) if(parts[i]>parts[idx]) idx=i;
    parts[idx]-=need;
  }
  const seen=new Set();
  for(let i=0;i<parts.length;i++){
    let c=parts[i];
    while(seen.has(c)){ c+=1; parts[parts.length-1]-=1; }
    seen.add(c); parts[i]=c;
  }
  return parts;
}

/* ---------- variance analysis tables (Revenue & Profitability): two bases -----------------
   "vs prior period": the equal-length contiguous run of quarters immediately before the
   selection (single quarter -> prior quarter). Undefined/disabled when the selection isn't
   contiguous, or the run would reach before Q1 FY25 (index 0).
   "vs prior year": Revenue uses the filed PY-sibling arrays (totalRevPY / cat.revenuePY /
   geo.revenuePY), which cover all 7 indices, so it's always available there. Profitability's
   is.* arrays have no PY sibling, so it reuses the same same-quarter-lookback convention as
   aggYoYSameQtr/pyQIdxsOf: only available when every selected quarter is FY26 (index >= 4). ---- */
function priorPeriodQIdxs(qIdxs){
  const s=[...(qIdxs||selQ())].sort((a,b)=>a-b);
  if(!s.length || !isContiguous(s)) return null;
  const n=s.length, start=s[0]-n;
  return start<0 ? null : Array.from({length:n},(_,k)=>start+k);
}
// label for the FY25-and-earlier prior-year range Revenue's PY-sibling arrays draw on, which
// predates index 0 and so has no real qIdxs of its own -- decrements the FY digits off qLabel().
function priorYearLabelFor(qIdxs){
  const s=[...(qIdxs||selQ())].sort((a,b)=>a-b);
  if(!s.length) return "n/a";
  const shiftFY=lbl=>lbl.replace(/FY(\d+)/,(m,yy)=>"FY"+(+yy-1));
  if(s.length===1) return shiftFY(qLabel(s[0]));
  if(isContiguous(s)) return `${shiftFY(qLabel(s[0]))} – ${shiftFY(qLabel(s[s.length-1]))} · ${s.length} quarters`;
  return `${s.length} quarters, one year earlier`;
}

// varCell: one colored, house-style variance figure -- unfavorable (or literally negative, when

function varCell(val,favorable,opts){
  opts=opts||{};
  if(val==null) return `<span class="vd">n/a</span>`;
  if(val===0) return `<span class="vd">${opts.pts?"0.0 pts":opts.pct?"0.0%":"0"}</span>`;
  const dp=opts.pts?1:(opts.pct?1:0);
  const mag=Math.abs(val).toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp});
  const suffix=opts.pts?" pts":(opts.pct?"%":"");

/* ---------- Q4 FY26E guided ghost bar (Feature 3): Apple's own forecast, parsed from
   D.fwd.revGuide ("9% to 11%") -- never hardcoded. Value = Q4 FY25 filed revenue grown by the
   midpoint of the guided range. Shown only when Q3 FY26 (idx 6) is in the current selection, and
   only on the two quarter-axis revenue trend charts named in spec (Revenue trend, Glass gTrend).
   Entirely separate from `values`/`labels` passed to barChart, so it can never enter a sum,
   aggregate, CSV export, or cross-filter click. ---------- */
function parseGuideRange(str){
  const m=/(-?\d+(?:\.\d+)?)\s*%?\s*to\s*(-?\d+(?:\.\d+)?)\s*%/i.exec(str||"");
  if(!m) return null;
  const lo=+m[1], hi=+m[2];
  return {lo,hi,mid:(lo+hi)/2};
}
function ghostQ4FY26(){
  if(!selQ().includes(6)) return null; // only append the estimate when Q3 FY26 is selected
  const g=parseGuideRange(D.fwd.revGuide);
  const py=D.is.totalRev[3]; // Q4 FY25, filed
  if(!g || py==null) return null;

  };
}

function homeChartValue(v,format){
  if(format==="pct") return `${v.toFixed(1)}%`;

  if(format==="headcount") return `${Math.round(v/1000)}K`;

function homeMiniChart(svg,values,kind="line",secondary=null){
  if(!svg) return;
  const primary=(values||[]).filter(v=>Number.isFinite(v));
  const second=(secondary||[]).filter(v=>Number.isFinite(v));
  const nums=primary.concat(second);
  if(nums.length<2) return;
  const W=180,H=28,pad=3,min=Math.min(...nums),max=Math.max(...nums),range=max-min||1;
  const labels=(svg.dataset.homeLabels||"").split("|");
  const format=svg.dataset.homeFormat||"money";
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML="";
  const addTitle=(node,i,series)=>{
    const title=el("title",{},node);
    title.textContent=`${labels[i]||"Quarter"}${series?` · ${series}`:""}: ${homeChartValue((series?secondary:primary)[i],format)}`;
  };
  if(kind==="grouped"){
    const n=Math.max(primary.length,second.length), slot=W/n, bw=Math.max(3,slot*.24);
    for(let i=0;i<n;i++){
      const x0=i*slot+(slot-bw*2-3)/2;
      [[primary[i],"Buybacks", "var(--home-chart-accent, var(--home-card-accent, var(--accent)))"],[second[i],"Dividends","var(--up)"]].forEach((row,j)=>{
        const val=row[0]; if(!Number.isFinite(val)) return;
        const h=5+((val-min)/range)*(H-8), rect=el("rect",{x:x0+j*(bw+3),y:H-h,width:bw,height:h,rx:2,fill:row[2],class:j===1?"chart-secondary":""},svg);
        addTitle(rect,i,row[1]);
      });
    }
    return;
  }
  if(kind==="bars"){
    const slot=W/primary.length, bw=Math.max(4,slot*.42);
    primary.forEach((v,i)=>{
      const h=5+((v-min)/range)*(H-8), x=i*slot+(slot-bw)/2;
      const rect=el("rect",{x,y:H-h,width:bw,height:h,rx:2},svg); addTitle(rect,i);
    });
    return;
  }
  const pts=primary.map((v,i)=>`${pad+i*(W-pad*2)/(primary.length-1)},${H-pad-((v-min)/range)*(H-pad*2)}`).join(" ");
  el("polygon",{points:`${pad},${H-pad} ${pts} ${W-pad},${H-pad}`,class:"home-chart-area"},svg);
  el("polyline",{points:pts},svg);
  primary.forEach((v,i)=>{
    const cx=pad+i*(W-pad*2)/(primary.length-1), cy=H-pad-((v-min)/range)*(H-pad*2);
    const dot=el("circle",{cx,cy,r:2.1,fill:"var(--accent)"},svg); addTitle(dot,i);
  });
}

function drawFlow(){
  const svg=document.getElementById("flowSvg"); if(!svg) return;
  // Measure the wrapper, not the svg itself: .flow-svg carries a min-width in horizontal mode
  // (so it can force a horizontal scroll on medium screens), which would make the svg's own
  // getBoundingClientRect() always read >=820 and never let this fall through to vertical mode.
  const containerW=svg.parentElement.clientWidth||820;
  const ink=css("--ink"), ink2=css("--ink2"), mut=css("--muted"), ax=css("--axis"),
        s1=css("--s1"), s2=css("--s2");
  // one color per pipeline stage (SOURCE/GOVERNED DATA/BRIDGE/AI BUILD/OUTPUT), same fixed
  // categorical order used everywhere else on the dashboard -- so the column a box belongs to
  // is readable at a glance instead of every stage rendering in the same monochrome outline.
  const colColors=[css("--s1"),css("--s2"),css("--s3"),css("--s4"),css("--s5")];
  const vertical=containerW<640;
  svg.classList.toggle("flow-svg--h",!vertical);
  svg.style.height=vertical? flowVerticalHeight()+"px" : "186px";
  const {W,H}=svgBox(svg);
  if(vertical) drawFlowVertical(svg,W,H,{ink,ink2,mut,ax,s1,s2,colColors});
  else drawFlowHorizontal(svg,W,H,{ink,ink2,mut,ax,s1,s2,colColors});
}
// wrapTitle: greedy-fill a box title onto at most 2 lines so long compound labels ("SAP S/4HANA +
// SAP Analytics Cloud") fit a fixed-width box instead of overflowing it. maxChars is an estimate
// (SVG text isn't monospace) matching the approximate-width heuristics already used elsewhere in
// this file (see groupedBar's category-label shortener).
function wrapTitle(text,maxChars){
  const words=text.split(" ");
  let l1="",l2="";
  words.forEach(w=>{
    if(!l1 || (l1+" "+w).length<=maxChars) l1=(l1?l1+" ":"")+w;
    else l2=(l2?l2+" ":"")+w;
  });
  return l2? [l1,l2] : [l1];
}
// Two aligned lanes, same five columns (SOURCE / GOVERNED DATA / BRIDGE / AI BUILD / OUTPUT):
// the SAP lane is the production analogue (muted -- thin grey borders, quieter text) and the demo
// lane underneath is how this dashboard was actually built (accent-tinted fill, bolder border and
// text) so the eye lands on the thing that's real, not the thing that's illustrative.
const FLOW_COLS=["SOURCE","GOVERNED DATA","BRIDGE","AI BUILD","OUTPUT"];
const FLOW_LANE_SAP=[
  ["ERP + planning + HRIS + CRM","actuals · plan · workforce · pipeline"],
  ["Semantic and metric layer","governed definitions · close controls"],
  ["Scoped finance tools","read-only access · calculations · lineage"],
  ["Agentic FP&A skill","context routing · checks · narrative"],
  ["Management decision loop","forecast · actions · reporting"]
];
const FLOW_LANE_DEMO=[
  ["SEC EDGAR + curated reports","10-Q · 10-K · sourced disclosures"],
  ["Company registry + finance engine","normalized facts · fiscal calendar"],
  ["Context router + deterministic tools","company · tab · period · filters"],
  ["Agentic finance skill","availability guardrails · QA · explanations"],
  ["Dashboard + AI + exports","actuals · scenarios · management view"]
];
function drawFlowHorizontal(svg,W,H,c){
  const {ink,ink2,mut,ax,s1,colColors}=c;
  const n=FLOW_COLS.length;
  const bw=Math.min(224,(W-20-(n-1)*16)/n), gapX=(W-20-n*bw)/(n-1);
  const colX=i=>10+i*(bw+gapX);
  const bh=48;
  function box(x,y,title,sub,emph,col){
    const stroke = emph? css("--accent") : ax;
    const fill = emph? `color-mix(in srgb, ${css("--accent")} 11%, ${css("--surface")})` : css("--surface");
    el("rect",{x,y,width:bw,height:bh,rx:11,fill,stroke,"stroke-width":emph?1.8:1},svg);
    // left-edge stage-color stripe -- same color as this column's header label, so a box's
    // pipeline stage is readable from color alone, not just position.
    el("rect",{x:x+4,y:y+6,width:3,height:bh-12,rx:1.5,fill:col},svg);
    const maxChars=Math.max(14,Math.floor((bw-20)/6.1));
    const lines=wrapTitle(title,maxChars);
    const titleY = lines.length>1? y+15 : y+18;
    lines.forEach((ln,li)=>{
      const t=el("text",{x:x+13,y:titleY+li*12,"text-anchor":"start",class:"dl"},svg);
      t.textContent=ln; t.setAttribute("fill",emph?ink:mut);
      t.setAttribute("style",`font:${emph?650:600} 10.5px 'Inter Tight',sans-serif`);
    });
    const subY=Math.min((lines.length>1? titleY+25 : titleY+15), y+bh-6);
    el("text",{x:x+13,y:subY,"text-anchor":"start",fill:emph?ink2:mut,style:"font-size:9px"},svg).textContent=sub;
  }
  function arrow(x1,y1,x2,y2){
    el("line",{x1,y1,x2,y2,stroke:ax,"stroke-width":1.3},svg);
    const ang=Math.atan2(y2-y1,x2-x1);
    el("path",{d:`M${x2},${y2} l${-6*Math.cos(ang-0.42)},${-6*Math.sin(ang-0.42)} M${x2},${y2} l${-6*Math.cos(ang+0.42)},${-6*Math.sin(ang+0.42)}`,
      stroke:ax,"stroke-width":1.3,fill:"none"},svg);
  }
  FLOW_COLS.forEach((label,i)=>{
    el("text",{x:colX(i)+bw/2,y:10,"text-anchor":"middle",fill:colColors[i],style:"font:650 8.4px Inter; letter-spacing:1px"},svg).textContent=label;
  });
  const laneAY=25, laneABoxY=laneAY+8;
  el("text",{x:10,y:laneAY,fill:mut,style:"font:600 9.2px Inter; letter-spacing:.2px"},svg).textContent="SAP · THE PRODUCTION ANALOGUE";
  FLOW_LANE_SAP.forEach((s,i)=>box(colX(i),laneABoxY,s[0],s[1],false,colColors[i]));
  for(let i=0;i<n-1;i++) arrow(colX(i)+bw, laneABoxY+bh/2, colX(i+1)-3, laneABoxY+bh/2);

  const laneBY=laneABoxY+bh+19, laneBBoxY=laneBY+8;
  el("text",{x:10,y:laneBY,fill:s1,style:"font:650 9.4px Inter; letter-spacing:.2px"},svg).textContent="THIS DEMO · HOW THIS WAS ACTUALLY BUILT";
  FLOW_LANE_DEMO.forEach((s,i)=>box(colX(i),laneBBoxY,s[0],s[1],true,colColors[i]));
  for(let i=0;i<n-1;i++) arrow(colX(i)+bw, laneBBoxY+bh/2, colX(i+1)-3, laneBBoxY+bh/2);
}
// Shared with flowVerticalHeight() below, which sums this same per-group arithmetic ahead of
// render to size the svg -- keep the two in sync if these change.
const FLOW_V_TOP=38, FLOW_V_BH=46, FLOW_V_LANEGAP=7, FLOW_V_GROUPGAP=22;
function flowVerticalHeight(){
  let y=FLOW_V_TOP;
  FLOW_COLS.forEach(()=>{ y=y+16+2*FLOW_V_BH+FLOW_V_LANEGAP+FLOW_V_GROUPGAP; });
  return y;
}
function drawFlowVertical(svg,W,H,c){
  const {ink,ink2,mut,ax,s1,colColors}=c;
  const bx=10, bw=W-20, bh=FLOW_V_BH, laneGap=FLOW_V_LANEGAP, groupGap=FLOW_V_GROUPGAP;
  function box(x,y,title,sub,emph,col){
    const stroke = emph? css("--accent") : ax;
    const fill = emph? `color-mix(in srgb, ${css("--accent")} 11%, ${css("--surface")})` : css("--surface");
    el("rect",{x,y,width:bw,height:bh,rx:11,fill,stroke,"stroke-width":emph?1.8:1},svg);
    // same left-edge stage-color stripe as the horizontal layout -- see drawFlowHorizontal's box()
    el("rect",{x:x+4,y:y+6,width:3,height:bh-12,rx:1.5,fill:col},svg);
    const t=el("text",{x:x+14,y:y+18,"text-anchor":"start",class:"dl"},svg);
    t.textContent=title; t.setAttribute("fill",emph?ink:mut); t.setAttribute("style",`font:${emph?650:600} 11px 'Inter Tight',sans-serif`);
    el("text",{x:x+14,y:y+33,"text-anchor":"start",fill:emph?ink2:mut,style:"font-size:9.6px"},svg).textContent=sub;
  }
  // one-time lane legend (labels repeat per column on the horizontal variant; here they'd repeat
  // five times, so state it once up top instead)
  el("text",{x:bx,y:12,fill:mut,style:"font:600 9.5px Inter; letter-spacing:.2px"},svg).textContent="top: SAP · THE PRODUCTION ANALOGUE";
  el("text",{x:bx,y:26,fill:s1,style:"font:650 9.7px Inter; letter-spacing:.2px"},svg).textContent="bottom: THIS DEMO · HOW THIS WAS ACTUALLY BUILT";
  let y=FLOW_V_TOP;
  FLOW_COLS.forEach((label,i)=>{
    el("text",{x:bx,y:y+9,fill:colColors[i],style:"font:650 8.4px Inter; letter-spacing:1px"},svg).textContent=label;
    const laneAY=y+16, laneBY=laneAY+bh+laneGap;
    box(bx,laneAY,FLOW_LANE_SAP[i][0],FLOW_LANE_SAP[i][1],false,colColors[i]);
    box(bx,laneBY,FLOW_LANE_DEMO[i][0],FLOW_LANE_DEMO[i][1],true,colColors[i]);
    const groupBottom=laneBY+bh;
    if(i<FLOW_COLS.length-1){
      const ay2=groupBottom+groupGap;
      el("line",{x1:bx+bw/2,x2:bx+bw/2,y1:groupBottom+2,y2:ay2-6,stroke:ax,"stroke-width":1.3},svg);
      el("path",{d:`M${bx+bw/2},${ay2} l-5,-8 l10,0 z`,fill:ax},svg);
    }
    y=groupBottom+groupGap;
  });
}

// shared sales-order-line generator for revenue & glass tabs (biproportional category x geography allocation)
// exact integer apportionment (largest-remainder method): parts sum exactly to `total`, no drift
function allocateByShare(total,shares){
  const raw=shares.map(s=>total*s);
  const parts=raw.map(Math.floor);
  let rem=total-parts.reduce((a,b)=>a+b,0);
  const order=raw.map((r,idx)=>({idx,frac:r-Math.floor(r)})).sort((a,b)=>b.frac-a.frac);
  for(let k=0;k<rem;k++) parts[order[k%order.length].idx]+=1;
  return parts;
}
function genSalesOrderRows(qIdxs,cats,geos,seedTag){
  const rnd=rndFor(seedTag);
  const rows=[]; let seq=1;
  const CHANNELS=[["Retail",0.32,RETAIL_W],["Online",0.41,RETAIL_W],["Channel Partner",0.27,B2B_W]];
  const ASP={"iPhone":850,"Mac":1450,"iPad":520,"Wearables, Home & Acc.":210,"Services":38};
  qIdxs.forEach(i=>{
    const allGeoTotal=sum(D.geo.names.map(g=>D.geo.revenue[g][i]));
    const {startISO,endISO}=quarterRange(i);
    const days=daysArray(startISO,endISO);
    cats.forEach(c=>{
      const catTotalCents=Math.round(D.cat.revenue[c][i]*1e8);
      // exact split of this category's real cents across ALL 5 geographies (largest-remainder,
      // no drift); a geo's cell value is then stable regardless of which other geos are selected
      const shares=D.geo.names.map(g=>D.geo.revenue[g][i]/allGeoTotal);
      const cellCentsAll=allocateByShare(catTotalCents,shares);
      D.geo.names.forEach((g,gi)=>{
        if(!geos.includes(g)) return;
        const cellCents=cellCentsAll[gi];
        if(cellCents<=0) return;
        const chW=CHANNELS.map(ch=>ch[1]*(0.8+rnd()*0.4));
        const chSum=chW.reduce((a,b)=>a+b,0);
        let chCents=CHANNELS.map((ch,k)=>Math.max(1,Math.round(cellCents*chW[k]/chSum)));
        let diff=cellCents-chCents.reduce((a,b)=>a+b,0); chCents[chCents.length-1]+=diff;
        CHANNELS.forEach((ch,k)=>{
          const name=ch[0]; const amtCents=chCents[k]; if(amtCents<=0) return;
          const dollars=amtCents/100, n=txnCount(dollars);
          allocateInt(amtCents,n,rnd).forEach(cents=>{
            if(cents<=0) return;
            const amt=cents/100, d=pickDate(days,rnd,ch[2]);
            const asp=ASP[c]||300;
            const units=Math.max(1,Math.round(amt/asp*(0.85+rnd()*0.3)));
            rows.push([`SO-${fyNum(i)}-${String(seq++).padStart(7,"0")}`, isoDate(d), qLabel(i), c, g, name, units, amt.toFixed(2),
              "category & geography quarter totals are REAL (filed, or Q4 FY25 derived per DATA_PROVENANCE.md); the category x geography cell is a MODELED biproportional allocation; order date, channel split and unit count are MODELED"]);
          });
        });
      });
    });
  });
  return rows;
}

function csvBalance(){
  const qIdxs=selQ();
  const rnd=rndFor("balance|"+qIdxs.join(","));
  const rows=[]; let seq=1;
  const AR_TYPES=["reseller","carrier","enterprise customer","channel partner","direct customer"];
  const AP_TYPES=["contract manufacturer","component supplier","logistics carrier","services vendor","facilities vendor"];
  const TERMS=[30,45,60];
  qIdxs.forEach(i=>{
    const bsIdx=i+1;
    const periodEnd=D.meta.quarterEnds[i];
    const {startISO}=quarterRange(i);
    const days=daysArray(startISO,periodEnd);
    function genLedger(kind,totalM,types){
      const totalCents=Math.round(totalM*1e8);
      const n=txnCount(totalCents/100);
      allocateInt(totalCents,n,rnd).forEach(cents=>{
        if(cents<=0) return;
        const invDate=pickDate(days,rnd,B2B_W);
        const terms=TERMS[Math.floor(rnd()*TERMS.length)];
        const dueDate=addDays(isoDate(invDate),terms);
        const type=types[Math.floor(rnd()*types.length)];
        const overdueDays=(new Date(periodEnd)-new Date(dueDate))/86400000;
        const bucket = overdueDays<0? "current" : overdueDays<=30? "1-30" : overdueDays<=60? "31-60" : overdueDays<=90? "61-90" : "90+";
        rows.push([`INV-${kind}-${fyNum(i)}-${String(seq++).padStart(7,"0")}`, kind, qLabel(i), type, isoDate(invDate), dueDate, "Net "+terms, (cents/100).toFixed(2), bucket,
          `${kind} period total is REAL (filed balance sheet, as of ${D.bs.dates[bsIdx]}); individual invoice record, counterparty type, terms and dates are MODELED`]);
      });
    }
    genLedger("AR",D.bs.ar[bsIdx],AR_TYPES);
    genLedger("AP",D.bs.ap[bsIdx],AP_TYPES);
  });
  downloadCSV(`apple_balance_ar_ap_${periodFileTag(qIdxs)}.csv`, PROVENANCE_LINE,
    ["invoice_id","type","fiscal_quarter","counterparty_type","invoice_date","due_date","terms","open_amount_usd","aging_bucket","field_basis"], rows);
}
