function csvFX(){
  const qIdxs=selQ();
  const rnd=rndFor("fx|"+qIdxs.join(","));
  const rows=[]; let seq=1;
  const INSTR=["Forward Contract","Cross-Currency Swap","Option Collar"];
  const PAIRS=["EUR/USD","JPY/USD","CNY/USD","GBP/USD","KRW/USD","CAD/USD","AUD/USD"];
  // hedge contracts — always as-of Q3 FY26 (point-in-time disclosure, not quarter-filtered)
  [["designated",D.fx.hedgeDesignated[0]],["non-designated",D.fx.hedgeNotDesignated[0]]].forEach(([kind,totalM])=>{
    const totalCents=Math.round(totalM*1e8);
    allocateInt(totalCents,txnCount(totalCents/100),rnd).forEach(cents=>{
      if(cents<=0) return;
      const instr=INSTR[Math.floor(rnd()*INSTR.length)], pair=PAIRS[Math.floor(rnd()*PAIRS.length)];
      const maturity=addDays("2026-06-27",30+Math.floor(rnd()*330));
      rows.push(["hedge_contract",`HDG-${String(seq++).padStart(7,"0")}`,"Q3 FY26",isoDate(new Date()),
        instr,pair,(cents/100).toFixed(2),maturity,
        `${kind} notional total is REAL (as of Jun 27, 2026 10-Q); individual contract instrument/currency-pair/maturity are MODELED`]);
    });
  });
  // buyback trade lots — real per selected quarter (cf.buybacks)
  qIdxs.forEach(i=>{
    const {startISO,endISO}=quarterRange(i);
    const days=daysArray(startISO,endISO);
    const priceBase=175+ i*7 + rnd()*4; // modeled illustrative share-price trend, not a filed figure
    const totalCents=Math.round(D.cf.buybacks[i]*1e8);
    allocateInt(totalCents,txnCount(totalCents/100),rnd).forEach(cents=>{
      if(cents<=0) return;
      const px=+(priceBase*(0.94+rnd()*0.12)).toFixed(2);
      const shares=Math.max(1,Math.round((cents/100)/px));
      const d=pickDate(days,rnd,B2B_W);
      rows.push(["buyback_trade",`BUY-${fyNum(i)}-${String(seq++).padStart(7,"0")}`,qLabel(i),isoDate(d),
        "open market",px,(cents/100).toFixed(2),"",
        "quarterly buyback notional is REAL (cash flow statement); trade lot date, share price and share count are MODELED"]);
    });
    const divCents=Math.round(D.cf.dividends[i]*1e8);
    const BATCH=["DTC batch","Direct registration","Employee ESPP/RSU withholding"];
    allocateInt(divCents,Math.max(3,Math.min(10,txnCount(divCents/100)/2|0)),rnd).forEach(cents=>{
      if(cents<=0) return;
      const d=pickDate(days,rnd,B2B_W);
      rows.push(["dividend_payment",`DIV-${fyNum(i)}-${String(seq++).padStart(7,"0")}`,qLabel(i),isoDate(d),
        BATCH[Math.floor(rnd()*BATCH.length)],"",(cents/100).toFixed(2),"",
        "quarterly dividend total is REAL (cash flow statement); payment-run batching and date are MODELED"]);
    });
  });
  downloadCSV(`apple_fx_capital_returns_${periodFileTag(qIdxs)}.csv`, PROVENANCE_LINE,
    ["record_type","id","fiscal_quarter","date","detail1","detail2","amount_usd","maturity_or_blank","field_basis"], rows);
}

function csvPeople(){
  const rnd=rndFor("people");

  const totalUnits=Math.round(h9moUnits());

  const days=daysArray(fyStart,fyEnd);
  allocateInt(totalUnits, Math.max(20,Math.min(600,Math.round(totalUnits/1500))), rnd).forEach(units=>{

    const d=pickDate(days,rnd,B2B_W);

  });

  const qIdxs=selQ();
  qIdxs.forEach(i=>{

function buildNav(){
  document.getElementById("nav").innerHTML=visibleViews().filter(v=>v.id!=="reports").map(v=>
    `<button class="tab" role="tab" data-id="${v.id}" aria-selected="${v.id===current}">${v.name}</button>`).join("");
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>go(t.dataset.id)));
  const nav=document.getElementById("nav");
  nav.addEventListener("scroll",positionNavChevron,{passive:true});
  positionNavChevron();
}
// positionNavChevron: mobile-only "more tabs this way" cue, layered over (not inside) the
// scrollable nav strip so it isn't caught by nav's own edge-fade mask. Shown only while there's
// unscrolled content to the right; JS-positioned because the topbar wraps to a variable height
// above the nav row at mobile widths, so a fixed CSS offset can't track it reliably.
function positionNavChevron(){
  const nav=document.getElementById("nav"), chev=document.getElementById("navChevron"), bar=document.querySelector(".topbar");
  if(!nav||!chev||!bar) return;
  if(matchMedia("(min-width:1400px)").matches){ chev.style.display="none"; return; }
  const scrollable = nav.scrollWidth > nav.clientWidth+2;
  const atEnd = nav.scrollLeft + nav.clientWidth >= nav.scrollWidth-2;
  if(!scrollable || atEnd){ chev.style.display="none"; return; }
  chev.style.display="flex";
  const nr=nav.getBoundingClientRect(), br=bar.getBoundingClientRect();
  chev.style.left=(nr.right-br.left-30)+"px";
  chev.style.top=(nr.top-br.top+nr.height/2-12)+"px";
}
addEventListener("resize",positionNavChevron);

function wireFiltersPanelEvents(){
  const panel=document.getElementById("filtersPanel");
  panel.addEventListener("click",e=>{
    const presetBtn=e.target.closest(".gp-preset");
    if(presetBtn){
      const p=presetBtn.dataset.preset, presets=companyPeriodPresets();
      state.q=new Set(presets[p]||presets.current);
      prevQSelection=null;
      afterFilterChange();
      return;
    }
    const resetBtn=e.target.closest(".fp-reset");
    if(resetBtn){
      // cat / geo: "All" fills the section, "None" clears it -- category and geography have no
      // min-1 floor (unlike period), so a fully empty section is a valid, supported state.
      switch(resetBtn.dataset.reset){
        case "cat": D.cat.names.forEach(n=>state.cat.add(n)); break;
        case "cat-none": state.cat.clear(); break;
        case "geo": D.geo.names.forEach(n=>{ state.geo.add(n); state.pgeo.add(n); }); break;
        case "geo-none": state.geo.clear(); state.pgeo.clear(); break;
      }
      afterFilterChange();
    }
  });
  panel.addEventListener("change",e=>{
    const t=e.target;
    if(t.matches("[data-q-idx]")){
      const idx=+t.dataset.qIdx;
      if(t.checked) state.q.add(idx);
      else if(state.q.size>1) state.q.delete(idx);
      else { t.checked=true; return; } // period keeps a min-1-quarter floor
      prevQSelection=null;
      afterFilterChange();
    } else if(t.matches("[data-cat-idx]")){
      const n=D.cat.names[+t.dataset.catIdx];
      if(t.checked) state.cat.add(n); else state.cat.delete(n); // may go to zero -- see note above
      afterFilterChange();
    } else if(t.matches("[data-geo-idx]")){
      const n=D.geo.names[+t.dataset.geoIdx];
      if(t.checked){ state.geo.add(n); state.pgeo.add(n); } else { state.geo.delete(n); state.pgeo.delete(n); }
      afterFilterChange();
    }
  });
}
// filtersAreDefault: true when state exactly matches the landing default (latest filed quarter,
// every
// category, every geography). Drives the sole visible "something is filtered" affordance now that
// the pill carries no text -- a small dot (see .filter-dot / #filterDot).
function filtersAreDefault(){
  const qDefault = sameIndexes(state.q,currentFiscalYtdIndexes());
  if(companySlug!=="apple") return qDefault;
  return qDefault && state.cat.size===D.cat.names.length && state.geo.size===D.geo.names.length && state.pgeo.size===D.geo.names.length;
}
// syncFiltersPanel: mutates the ALREADY-BUILT panel's checkboxes/preset checkmarks/dot badge in
// place to match `state` -- no innerHTML rebuild, so an in-progress keyboard/focus interaction with
// the open panel is never interrupted. Safe to call even if the panel hasn't been built yet.
// Category/geography checkboxes have NO min-1 floor (unlike period) -- deselecting every box in a
// section is a valid, supported state; render functions handle the resulting empty selection.
function syncFiltersPanel(){
  const panel=document.getElementById("filtersPanel");
  if(panel){
    const s=state.q, presets=companyPeriodPresets();
    panel.querySelectorAll(".gp-preset").forEach(btn=>{
      const p=btn.dataset.preset;
      btn.setAttribute("aria-pressed", String(sameIndexes(s,presets[p]||[])));
    });
    panel.querySelectorAll("[data-q-idx]").forEach(inp=>{
      const idx=+inp.dataset.qIdx, has=s.has(idx);
      inp.checked=has; inp.disabled=has&&s.size<=1;
    });
    panel.querySelectorAll("[data-cat-idx]").forEach(inp=>{
      const n=D.cat.names[+inp.dataset.catIdx];
      inp.checked=state.cat.has(n);
    });
    panel.querySelectorAll("[data-geo-idx]").forEach(inp=>{
      const n=D.geo.names[+inp.dataset.geoIdx];
      inp.checked=state.geo.has(n);
    });
  }
  const dot=document.getElementById("filterDot");
  if(dot) dot.style.display = filtersAreDefault() ? "none" : "block";
}
function buildFiltersBar(){
  const bar=document.getElementById("filterbar");
  bar.innerHTML=`<div class="filters-unit" id="filtersUnit">
    <div class="perioddrop" id="filtersDrop">
      <button type="button" class="perbtn" id="filtersBtn" aria-haspopup="true" aria-expanded="false">
        <svg class="funnel-icon" viewBox="0 0 16 16" width="9" height="9" aria-hidden="true"><path d="M1.5 3h13l-5 6v4.2l-3 1.6V9z"/></svg>
        Filters <span aria-hidden="true">▾</span>
        <span class="filter-dot" id="filterDot" aria-hidden="true" style="display:none"></span>
      </button>
      ${filtersPanelHTML()}
    </div>
  </div>`;
  document.getElementById("filtersBtn").addEventListener("click",()=>toggleDrop("filters"));
  document.getElementById("filtersClose").addEventListener("click",closeDropdown);
  document.getElementById("filtersDone").addEventListener("click",closeDropdown); // pure closure -- every control above already applies live, nothing to "submit"
  wireFiltersPanelEvents();
  syncFiltersPanel();
}
function go(id){
  // Exec Summary used to force dark theme and disable the toggle -- it now uses the same
  // theme-aware tokens as every other tab (see .glassview), so it just follows whatever theme
  // is already active, light or dark, like the rest of the dashboard.
  current=id;
  let activeTab=null;
  document.querySelectorAll(".tab").forEach(t=>{
    const sel=t.dataset.id===id; t.setAttribute("aria-selected",String(sel)); if(sel) activeTab=t;
  });
  const reportsBtn=document.getElementById("reportsBtn");
  if(reportsBtn) reportsBtn.setAttribute("aria-pressed",String(id==="reports"));
  // keep the active tab in view on the horizontally-scrolling nav strip (mobile: nav is often
  // wider than the viewport), so a deep link or tab switch never lands off-screen
  if(activeTab){
    const strip=activeTab.parentElement;
    if(strip){
      const left=activeTab.offsetLeft, right=left+activeTab.offsetWidth;
      if(left<strip.scrollLeft) strip.scrollLeft=Math.max(0,left-8);
      else if(right>strip.scrollLeft+strip.clientWidth) strip.scrollLeft=right-strip.clientWidth+8;
    }
  }
  syncThemeBtn();
  render();
}
function syncThemeBtn(){
  const btn=document.getElementById("themeBtn");
  const dark=document.documentElement.getAttribute("data-theme")==="dark";
  btn.textContent=dark?"Light":"Dark";
}
const RENDER={home:renderHome,company:renderCompany,glass:renderGlass,revenue:renderRevenue,plan:renderPlan,profit:renderProfit,
  variance:renderVariance,balance:renderBalance,fx:renderFX,people:renderPeople,outlook:renderOutlook,env:renderEnv,reports:renderReports};
const CSV_FN={home:csvHome,company:csvCompany,glass:csvGlass,revenue:csvRevenue,plan:csvPlan,profit:csvProfit,
  variance:csvVariance,balance:csvBalance,fx:csvFX,people:csvPeople,outlook:csvOutlook,env:csvEnv,reports:csvReports};
// relocateFiltersUnit: the Filters button+panel+summary is ONE node (#filtersUnit), built once
// in buildFiltersBar(). Home keeps it on the dedicated line under the header (#filterbar,
// visible); every other tab instead hosts it inline in that tab's own .vhead-right cluster,
// right before the Download CSV button (badge/note, then Filters, then CSV -- same order on
// every tab). This MOVES the live node (appendChild relocates, it does not clone/rebuild), so
// its open/closed state, listeners and in-place checkbox sync all survive the move untouched.
function relocateFiltersUnit(){
  const unit=document.getElementById("filtersUnit"), bar=document.getElementById("filterbar");
  if(!unit || !bar) return;
  // #filterbar is now only a transient holding spot (see render()'s rescue step below) -- every
  // tab, Home included, hosts the live Filters unit inline in its own header row instead.
  bar.style.display="none";
  const tabEl=document.getElementById(current);
  const vheadRight=tabEl? tabEl.querySelector(".vhead-right") : null;
  if(!vheadRight){ if(unit.parentElement!==bar) bar.appendChild(unit); return; } // fallback, shouldn't occur
  const dl=document.getElementById("dlBtn");
  if(dl && dl.parentElement===vheadRight) vheadRight.insertBefore(unit,dl);
  else vheadRight.appendChild(unit);
}
function render(){
  hideTT(); // never let a stale tooltip survive a re-render (tab switch, filter change, resize, theme toggle)
  const main=document.getElementById("main");
  // #filtersUnit may currently live inside a non-Home tab's .vhead-right -- i.e. inside #main.
  // Rescue it to the (outside-#main, persistent) #filterbar FIRST, before wiping #main's
  // innerHTML below, or the node is destroyed along with the old tab markup and never comes back.
  const filtersUnitNow=document.getElementById("filtersUnit"), filterbarHold=document.getElementById("filterbar");
  if(filtersUnitNow && filterbarHold && filtersUnitNow.parentElement!==filterbarHold) filterbarHold.appendChild(filtersUnitNow);
  main.innerHTML=`<section class="view" data-active="true" id="${current}"></section>`;
  const view=document.getElementById(current);
  if(companySlug!=="apple" && current!=="company" && current!=="plan") renderPeerTab(current,view);
  else RENDER[current](view);
  if(current!=="reports" && current!=="env") view.insertAdjacentHTML("beforeend",annualReportHTML({tab:current}));
  relocateFiltersUnit();
  const dl=document.getElementById("dlBtn");
  if(dl) dl.addEventListener("click",()=>{
    if(companySlug!=="apple" && current!=="company" && current!=="plan") csvPeerTab(current);
    else CSV_FN[current]();
  });
  const rangeTxt = periodLabel();
  document.getElementById("foot").textContent =
    companySlug!=="apple" || current==="company" || current==="plan" || current==="reports"
    ? `Source: ${COMPANY_DATA.companies[companySlug].name} SEC filings via SEC Company Facts. Filed values are shown directly; derived Q4/YTD arithmetic and modeled scenarios are labeled. Showing ${rangeTxt}. Built by Govind Waghmare · govindwaghmare.me`
    : current==="home"
    ? `Sources: Apple Inc. FY25 Form 10-K (filed Oct 31, 2025); FY25 Q1–Q3 and FY26 Q1–Q3 Form 10-Qs; Q3 FY26 earnings call (July 30, 2026); 2026 Environmental Progress Report; Apple Newsroom. Showing ${rangeTxt}. Built by Govind Waghmare · govindwaghmare.me`
    : current==="env"
    ? "Source: Apple 2026 Environmental Progress Report and Apple Newsroom (April 2026). No internal, estimated, or modeled data on-screen; the CSV export's facility-level allocation is modeled and clearly labeled. Built by Govind Waghmare · govindwaghmare.me"
    : `All figures as reported by Apple Inc. in its SEC filings and earnings call. Showing ${rangeTxt}. CSV exports contain modeled transaction-level detail reconciled to these totals, clearly labeled. Built by Govind Waghmare · govindwaghmare.me`;
  updateAICtx();
  if(COMPANY_DATA) renderAISugg();
  applyDropVisibility();
  syncHash();
}
document.getElementById("themeBtn").addEventListener("click",()=>{
  const r=document.documentElement;
  const dark=r.getAttribute("data-theme")!=="dark";
  r.setAttribute("data-theme",dark?"dark":"light");
  syncThemeBtn();
  render();

/* ---------- Ask AI ---------- */

      aiInput=document.getElementById("aiInput"), aiSend=document.getElementById("aiSend"),
      selPill=document.getElementById("selPill");
let pendingSelection=null, aiMode="dashboard";
// buildSuggestions/renderAISugg run AFTER D loads (called from loadData()) -- two of the five
// suggestion chips cite figures straight from D (gross margin %, Scope 3 share) rather than
// hardcoding them, so they can never drift from the dataset.
function buildSuggestions(){
  if(aiMode==="general") return [
    "Explain free cash flow in simple terms.",
    "What is CSRD and why does it matter?",
    "How should I interpret gross margin?"
  ];
  const company=COMPANY_DATA.companies[companySlug], name=company.name;
  const byTab={
    home:[`Summarize ${name}'s selected period.`,`What are the biggest financial changes for ${name}?`,`What should an FP&A leader watch next for ${name}?`],
    company:[`Summarize ${name}'s latest selected quarter.`,`How has ${name}'s revenue changed year over year?`,`What is driving ${name}'s operating margin?`,`How much free cash flow did ${name} generate?`],
    glass:[`Write an executive summary for ${name}.`,`What are ${name}'s main financial risks and opportunities?`,`Which ${name} metrics need management attention?`],
    revenue:[`How has ${name}'s revenue changed in the selected period?`,`Compare ${name}'s latest revenue with the prior year.`,`What revenue detail is unavailable for ${name}?`],
    variance:[`Which metrics drove ${name}'s variance?`,`Separate favorable and unfavorable ${name} movements.`,`What should FP&A investigate for ${name}?`],
    plan:[`Explain the ${planningState.scenario} scenario and investment case for ${name}.`,`Which assumption has the biggest operating-income or NPV impact?`,`Does the modeled investment clear its hurdle rate?`],
    profit:[`Explain ${name}'s gross and operating margins.`,`How is ${name}'s R&D spending changing?`,`What profitability movement stands out for ${name}?`],
    balance:[`What changed in ${name}'s liquidity and debt?`,`Summarize ${name}'s receivables and payables.`,`What balance-sheet data is unavailable for ${name}?`],
    fx:[`How much did ${name} return through buybacks and dividends?`,`Summarize ${name}'s cash and debt position.`,`What FX evidence is available for ${name}?`],
    people:[`How is ${name}'s R&D investment changing?`,`What workforce data is available for ${name}?`,`Why is ${name}'s headcount unavailable here?`],
    outlook:[`What can the filings support about ${name}'s outlook?`,`Summarize ${name}'s latest reported momentum.`,`What guidance data is unavailable for ${name}?`],
    env:[`What environmental data is available for ${name}?`,`Why are ${name}'s Scope 1–3 figures unavailable?`,`What source is needed to populate this tab?`],
    reports:[`Draft the ${REPORT_DEFINITIONS[reportState].label} narrative for ${name}.`,`Which report sections are supported by filed evidence?`,`What information is unavailable in this ${REPORT_DEFINITIONS[reportState].label}?`]
  };
  return byTab[current]||byTab.home;
}
function renderAISugg(){
  document.getElementById("aiSugg").innerHTML=buildSuggestions().map(s=>`<button type="button">${escapeHtml(s)}</button>`).join("");
  document.querySelectorAll("#aiSugg button").forEach(b=>b.addEventListener("click",()=>{aiInput.value=b.textContent; askAI();}));
  if(aiMode==="dashboard") aiInput.placeholder=`Ask about ${COMPANY_DATA.companies[companySlug].name}, ${periodLabel()}`;
}
function setAIMode(mode){
  aiMode=mode==="general"?"general":"dashboard";
  document.querySelectorAll("[data-ai-mode]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.aiMode===aiMode)));
  document.getElementById("aiModeDescription").textContent=aiMode==="dashboard"

  aiInput.placeholder=aiMode==="dashboard"
    ? `Ask about ${COMPANY_DATA.companies[companySlug].name}, ${periodLabel()}`
    : "Ask a general question";
  if(aiMode==="general") pendingSelection=null;
  renderAISugg();
  updateAICtx();
}
function openAI(mode){
  hideTT();
  if(mode==="dashboard"||mode==="general") setAIMode(mode);
  drawer.setAttribute("data-open","true"); aiInput.focus(); updateAICtx();
}
function closeAI(){ hideTT(); drawer.setAttribute("data-open","false"); }
function updateAICtx(){
  const el=document.getElementById("aiFilterCtx");
  if(!el||!D) return;
  el.textContent=aiMode==="dashboard"
    ? `Source: ${COMPANY_DATA.companies[companySlug].name}. Tab: ${VIEWS.find(view=>view.id===current)?.name||current}. Period: ${periodLabel()}.${current==="plan"?` Scenario: ${planningState.scenario}. Decision case: modeled.`:""} Only matching evidence is sent.`
    : "No dashboard figures or filters are sent in General AI mode.";
}
function aiFiltersPayload(){
  return {quarterIndexes:[...state.q].sort((a,b)=>a-b), quarterLabels:selQ().map(qLabel), categories:companySlug==="apple"?[...state.cat]:[], geographies:companySlug==="apple"?[...state.geo]:[], scenario:current==="plan"?{...planningState,decision:{...ensureDecisionState()}}:null};
}
document.querySelectorAll("[data-ai-mode]").forEach(button=>button.addEventListener("click",()=>setAIMode(button.dataset.aiMode)));
document.getElementById("aiBtn").addEventListener("click",()=>openAI());
document.getElementById("aiClose").addEventListener("click",closeAI);
// single Escape handler, explicit priority: drill overlay > open dropdown > AI drawer
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(drillOverlayEl && drillOverlayEl.getAttribute("data-open")==="true"){ closeDrill(); return; }
  if(openDrop){ closeDropdown(); return; }
  if(drawer.getAttribute("data-open")==="true"){ closeAI(); return; }
});
// outside-click closes an open glass dropdown; capture phase runs BEFORE the click's own
// bubble-phase handler can rebuild the filterbar/tab DOM, so target ancestry is still intact.
document.addEventListener("click",e=>{
  if(!openDrop) return;
  if(e.target.closest(`#${openDrop}Btn, #${openDrop}Panel`)) return;
  closeDropdown();
}, true);
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function mdToHtml(text){
  // normalize runs of 3+ blank lines to a single paragraph break before anything else touches it
  const esc=escapeHtml(text.replace(/\n{3,}/g,"\n\n"));
  let html="", para=[], list=[], listType=null; // listType: "ul" | "ol" | null
  const flushPara=()=>{ if(para.length){ html+="<p>"+para.join("<br>")+"</p>"; para=[]; } };
  const flushList=()=>{ if(list.length){ html+=`<${listType}>`+list.map(l=>"<li>"+l+"</li>").join("")+`</${listType}>`; } list=[]; listType=null; };
  for(const raw of esc.split("\n")){
    const line=raw.trim();
    const bullet=/^[-*]\s+(.*)$/.exec(line);
    const numbered=/^\d+[.)]\s+(.*)$/.exec(line);
    if(bullet){
      if(listType==="ol") flushList();
      flushPara(); listType="ul"; list.push(bullet[1]);
    } else if(numbered){
      if(listType==="ul") flushList();
      flushPara(); listType="ol"; list.push(numbered[1]);
    } else if(line===""){ flushPara(); flushList(); }
    else { flushList(); para.push(line); }
  }
  flushPara(); flushList();
  return html.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}
function addMsg(cls,text){
  const d=document.createElement("div"); d.className="ai-msg "+cls;
  if(cls==="bot") d.innerHTML=mdToHtml(text); else d.textContent=text;
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d;
}
async function askAI(){
  const q=aiInput.value.trim(); if(!q) return;
  addMsg("user", pendingSelection? `“${pendingSelection.slice(0,140)}”: ${q}` : q);
  aiInput.value=""; aiSend.disabled=true;
  const thinking=addMsg("bot","Thinking…");
  try{
    const r=await fetch("/api/ask",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({question:q, mode:aiMode, selectedText:aiMode==="dashboard"?pendingSelection:null,
        filters:aiMode==="dashboard"?aiFiltersPayload():undefined, tab:current, company:companySlug})});
    const j=await r.json();
    if(j.answer){
      thinking.innerHTML=mdToHtml(j.answer);
      if(j.meta){ thinking.dataset.route=j.meta.route||""; thinking.dataset.mode=j.meta.mode||aiMode; }
    }
    else if(j.error==="no_key") { thinking.className="ai-msg sys";
      thinking.textContent="The Claude API key isn't configured yet. Owner: add ANTHROPIC_API_KEY in Vercel → Project → Settings → Environment Variables, then redeploy."; }
    else { thinking.className="ai-msg sys"; thinking.textContent="The AI backend returned an error ("+(j.detail||j.error||"unknown")+"). Try again in a moment."; }
  }catch(err){
    thinking.className="ai-msg sys";
    thinking.textContent="Couldn't reach the AI backend. This works on the deployed site (Vercel), not when the file is opened locally.";
  }
  pendingSelection=null; aiSend.disabled=false;
}
document.getElementById("aiForm").addEventListener("submit",e=>{e.preventDefault(); askAI();});
aiInput.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); askAI(); }});
/* selection pill */
document.addEventListener("selectionchange",()=>{
  const sel=document.getSelection();
  const text=sel? sel.toString().trim():"";
  if(text.length>2 && text.length<600 && sel.rangeCount &&
     document.getElementById("main").contains(sel.anchorNode)){
    const r=sel.getRangeAt(0).getBoundingClientRect();
    selPill.style.display="block";
    selPill.style.left=Math.min(Math.max(r.left+r.width/2-44,8), innerWidth-108)+"px";
    selPill.style.top=Math.max(r.top-38,54)+"px";
    selPill.dataset.text=text;
  } else if(!text){ selPill.style.display="none"; }
});
selPill.addEventListener("mousedown",e=>{
  e.preventDefault();
  pendingSelection=selPill.dataset.text||null;
  selPill.style.display="none";
  openAI("dashboard");
  aiInput.value="Explain this figure and what's driving it.";
});

async function loadData(){
  try{
    const contextPromise=fetch("./company-context.json")
      .then(response=>response.ok?response.json():Promise.reject(new Error("Public context unavailable")))
      .catch(()=>({companies:{},macro:{}}));
    const [dataResponse,companyResponse,publicContext] = await Promise.all([fetch("./data.json"),fetch("./companies.json"),contextPromise]);
    D = await dataResponse.json();
    COMPANY_DATA = await companyResponse.json();
    PUBLIC_CONTEXT = publicContext;
  }catch(e){
    document.getElementById("main").innerHTML =
      '<p style="padding:40px;color:var(--muted)">Couldn\'t load data.json. This dashboard needs to be served over http(s) (not opened as a bare file://), and data.json must sit next to index.html.</p>';
    throw e;
  }
  initFilters();
  let restoredTab=parseHashState(); // may mutate state.q/cat/geo/pgeo; returns a tab id or null
  if(restoredTab==="env"&&companySlug!=="apple") restoredTab="home";
  const companySelect=document.getElementById("companySelect");
  companySelect.innerHTML=Object.entries(COMPANY_DATA.companies).map(([slug,company])=>`<option value="${slug}">${escapeHtml(company.name)} · ${escapeHtml(company.ticker)}</option>`).join("");
  companySelect.value=companySlug;
  companySelect.addEventListener("change",()=>{
    companySlug=companySelect.value;
    if(current==="env"&&companySlug!=="apple") current="home";
    state.q=new Set(currentFiscalYtdIndexes());
    prevQSelection=null;
    planningState={scenario:"base",...PLANNING_PRESETS.base};
    decisionState=null;
    const oldFilters=document.getElementById("filtersUnit");
    if(oldFilters) oldFilters.remove();
    buildFiltersBar();
    buildNav();
    go(current);
  });
  buildNav(); syncThemeBtn(); buildFiltersBar(); renderAISugg();
  go(restoredTab||current); // routed through go() so glass-tab theme forcing runs correctly
}
loadData();
