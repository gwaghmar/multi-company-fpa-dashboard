name: Refresh SEC company data

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sec-company-data
  cancel-in-progress: false

jobs:
  refresh-company-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rebuild official public datasets
        run: |
          python tools/fetch_company_sources.py
          python tools/fetch_public_context.py

      # data.json (Apple's detailed dataset) must carry the same quarter labels as Apple's periods in
      # companies.json. When a new Apple filing moves that window, rebuild data.json from EDGAR.
      # NOTE: tools/fetch_edgar_data.py derives Apple's 7-quarter window and filings list from SEC
      # EDGAR itself, so a new 10-Q/10-K moves the window with no code change. If EDGAR has not yet
      # published the new filing, this step rebuilds the same window and the test below fails
      # loudly (and nothing is committed). The hand-curated sections (fx, cap, hc, env, fwd) are
      # carried over verbatim and still need a manual refresh after each new quarter.
      - name: Rebuild data.json when Apple quarters changed
        run: |
          if node -e '
            const fs=require("fs");
            const n=l=>String(l).replace(/\s+/g," ").trim();
            const d=JSON.parse(fs.readFileSync("data.json","utf8")).meta.quarters.map(n);
            const c=JSON.parse(fs.readFileSync("companies.json","utf8")).companies.apple.periods.map(p=>n(p.label));
            process.exit(JSON.stringify(d)===JSON.stringify(c)?0:1);
          '; then
            echo "data.json quarters already match companies.json"
          else
            python tools/fetch_edgar_data.py --no-csv
          fi

      - name: Verify AI evidence and calculations
        run: npm test

      - name: Write test status for the header strip
        run: node tools/write_status.mjs

      - name: Detect refreshed data
        id: changes
        run: |
          if git diff --quiet -- companies.json company-context.json data.json status.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit verified data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies.json company-context.json data.json status.json
          git commit -m "Refresh official company context"
          git push
