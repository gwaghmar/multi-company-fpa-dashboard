name: Refresh SEC company data

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sec-company-data
  cancel-in-progress: false

jobs:
  refresh-company-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: "Govind Waghmare sec-contact@example.invalid"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rebuild official public datasets
        run: |
          python tools/fetch_company_sources.py
          python tools/fetch_public_context.py

      - name: Verify AI evidence and calculations
        run: npm test

      - name: Detect refreshed data
        id: changes
        run: |
          if git diff --quiet -- companies.json company-context.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit verified data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies.json company-context.json
          git commit -m "Refresh official company context"
          git push
